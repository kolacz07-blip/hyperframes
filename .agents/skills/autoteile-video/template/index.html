<!doctype html>
<html
  lang="de"
  data-composition-variables='[{"id":"title","type":"string","label":"Titel","default":"Das Radlager"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/vendor/three.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6b47a;
      }
      #main {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #f6b47a;
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-start="0"
      data-duration="54.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="54.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="54.5"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <audio id="sfx-abs" class="clip" src="assets/sfx/pop.mp3" data-start="42.66" data-duration="0.70" data-track-index="12" data-volume="0.6"></audio>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
