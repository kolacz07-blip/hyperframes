<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #cc6b50; }
      body { font-family: Montserrat, "Arial Black", sans-serif; }
      /* the part, a bit larger and lower so the headline has room */
      #bg0 { position: absolute; left: -54px; top: -40px; width: 1188px; height: 2112px; }
      #bg { position: absolute; left: -54px; top: 230px; width: 1188px; height: 2112px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 260px); mask-image: linear-gradient(to bottom, transparent 0, #000 260px); }
      /* TikTok's profile grid crops covers to ~3:4 around the centre: keep text within y 260–1660 */
      .badge { position: absolute; left: 0; right: 0; top: 280px; text-align: center; }
      .badge span { display: inline-block; background: #ffd24a; color: #1f1a24; font-weight: 900; font-size: 84px; line-height: 1; padding: 16px 40px 22px; border: 8px solid #1f1a24; transform: rotate(-3deg); }
      .head { position: absolute; left: 0; right: 0; top: 440px; text-align: center; }
      .head span { display: inline-block; background: #1f1a24; color: #fff; font-weight: 900; font-size: 116px; line-height: 1.04; letter-spacing: -0.03em; padding: 18px 40px 26px; }
      .head .accent { color: #ffd24a; }
      .part { position: absolute; left: 0; right: 0; top: 1430px; text-align: center; }
      .part .name { display: inline-block; background: #ffd24a; color: #1f1a24; font-weight: 900; font-size: 104px; line-height: 1; letter-spacing: -0.02em; padding: 18px 44px 26px; border: 8px solid #1f1a24; }
      .part .sub { display: block; margin-top: 18px; color: #fff; font-weight: 800; font-size: 50px; text-shadow: 0 4px 0 #1f1a24; }
    </style>
  </head>
  <body>
    <img id="bg0" src="bg.png" alt="" />
    <img id="bg" src="bg.png" alt="" />
    <div class="badge"><span>TEIL __N__</span></div>
    <div class="head"><span>__L1__<br /><span class="accent">__L2__</span></span></div>
    <div class="part"><span class="name">__PART__</span><span class="sub">einfach erklärt</span></div>
  <script>
      // fit long part names (TROMMELBREMSE) inside the frame
      document.fonts.ready.then(() => {
        const n = document.querySelector(".part .name");
        let f = 104;
        while (n.offsetWidth > 960 && f > 56) n.style.fontSize = (f -= 4) + "px";
      });
    </script>
  </body>
</html>
