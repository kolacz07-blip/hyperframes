  <script>
    (function () {
      /*TIMING*/ const LINES = {"l1":{"start":0.3,"end":5.06},"l2":{"start":5.314,"end":10.823},"l3":{"start":11.224,"end":16.839},"l4":{"start":17.387,"end":24.122},"l5":{"start":24.755,"end":28.607},"l6":{"start":28.797,"end":30.908}}; const M = {"heult":0.955,"kupplung":4.353,"motor":5.957,"getriebe":6.537,"pedal":8.311,"schalten":9.947,"scheibe":11.393,"reibbelag":12.533,"duenner":14.834,"schleifen":15.351,"rutscht":17.652,"drehzahl":18.813,"tempo":19.889,"verbrannt":21.631,"oben":23.689,"werkstatt":25.145,"kommentare":27.847,"naechstes":28.797,"lichtmaschine":29.969}; /*END TIMING*/
      const DUR = 34.2;
      const T = THREE;
      // ---------- helpers (deterministic)
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (a, b, t) => clamp01((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const E = {
        lin: (x) => x,
        io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
        io2: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
        in3: (x) => x * x * x,
        out3: (x) => 1 - Math.pow(1 - x, 3),
        out2: (x) => 1 - (1 - x) * (1 - x),
      };
      function h2(x, y) {
        let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        n ^= n >>> 16;
        return (n >>> 0) / 4294967296;
      }
      function vnoise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const flat = (color, extra) => new T.MeshLambertMaterial(Object.assign({ color, flatShading: true }, extra || {}));
      const col = (h) => new T.Color(h);

      // ---------- timing derived from the voice
      const tRoadIn = LINES.l5.start - 0.05; // cut to the road (iris)
      const tCarStop = tRoadIn + 2.6;
      const tOutroSpin = M.naechstes - 0.25; // the strip appears only at the end
      const tOutroStop = M.lichtmaschine + 0.05;
      const tFollow = Math.max(tOutroStop + 0.9, LINES.l6.end + 0.25);

      // ---------- renderer (portrait)
      const canvas = document.getElementById("world-canvas");
      const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      const camera = new T.PerspectiveCamera(50, 1080 / 1920, 0.03, 1400);

      // =========================================================
      // ROAD WORLD
      // =========================================================
      const road = new T.Scene();
      const FOG = "#f6b47a";
      road.fog = new T.Fog(FOG, 45, 420);
      road.add(new T.HemisphereLight("#ffe0b8", "#5a4636", 0.95));
      const sunLight = new T.DirectionalLight("#ffc890", 1.25);
      sunLight.position.set(60, 40, 120);
      road.add(sunLight);

      // sky dome, faceted
      {
        const g = new T.SphereGeometry(700, 18, 12).toNonIndexed();
        const pos = g.attributes.position;
        const colors = [];
        const top = col("#d9685a"), mid = col("#f08f5e"), hor = col(FOG);
        for (let i = 0; i < pos.count; i += 3) {
          const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 / 700;
          const c = y < 0.08 ? hor.clone() : y < 0.4 ? hor.clone().lerp(mid, (y - 0.08) / 0.32) : mid.clone().lerp(top, Math.min(1, (y - 0.4) / 0.5));
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        g.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        road.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false })));
        const sun = new T.Mesh(new T.CircleGeometry(34, 10), new T.MeshBasicMaterial({ color: "#ffe2a0", fog: false }));
        sun.position.set(150, 70, 560);
        sun.lookAt(0, 0, 0);
        road.add(sun);
      }

      function groundH(x, z) {
        const d = Math.abs(x);
        if (d < 6) return -0.02;
        const k = Math.min(1, (d - 6) / 14);
        return (d - 6) * 0.09 + k * (vnoise(x * 0.045, z * 0.045) * 9 + vnoise(x * 0.16, z * 0.16) * 1.6) - 0.02;
      }
      // terrain
      {
        const g = new T.PlaneGeometry(280, 560, 70, 140);
        g.rotateX(-Math.PI / 2);
        g.translate(0, 0, -80);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
        const ng = g.toNonIndexed();
        ng.computeVertexNormals();
        const q = ng.attributes.position;
        const greens = ["#6f9a52", "#5f8a49", "#82a85c", "#73a058"].map(col);
        const high = col("#b39a58"), peak = col("#c98552");
        const colors = [];
        for (let i = 0; i < q.count; i += 3) {
          const cx = (q.getX(i) + q.getX(i + 1) + q.getX(i + 2)) / 3;
          const cz = (q.getZ(i) + q.getZ(i + 1) + q.getZ(i + 2)) / 3;
          const cy = (q.getY(i) + q.getY(i + 1) + q.getY(i + 2)) / 3;
          let c = greens[Math.floor(h2(Math.round(cx * 3), Math.round(cz * 3)) * 4)].clone();
          if (cy > 5) c.lerp(high, Math.min(1, (cy - 5) / 5));
          if (cy > 10) c.lerp(peak, Math.min(1, (cy - 10) / 5));
          if (Math.abs(cx) < 4.6) c = col("#8a7a5c");
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        ng.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        road.add(new T.Mesh(ng, new T.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
      }
      // asphalt + markings
      {
        const asphalt = new T.Mesh(new T.PlaneGeometry(7.8, 560), flat("#4b4853"));
        asphalt.rotation.x = -Math.PI / 2;
        asphalt.position.set(0, 0.01, -80);
        road.add(asphalt);
        const lineMat = flat("#f1ede2");
        for (const x of [-3.6, 3.6]) {
          const m = new T.Mesh(new T.PlaneGeometry(0.14, 560), lineMat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(x, 0.02, -80);
          road.add(m);
        }
        const dashMat = flat("#f1ede2");
        const dashGeo = new T.PlaneGeometry(0.14, 3);
        for (let z = 190; z > -350; z -= 8) {
          const m = new T.Mesh(dashGeo, dashMat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(0, 0.02, z);
          road.add(m);
        }
      }
      // trees
      {
        const r = rng(7);
        const leafMats = ["#2f6b4f", "#3c7a52", "#4f8a4f"].map((c) => flat(c));
        const trunkMat = flat("#6b4430");
        const cone = new T.ConeGeometry(1, 1, 6);
        const trunkGeo = new T.CylinderGeometry(0.18, 0.24, 1, 5);
        for (let i = 0; i < 230; i++) {
          const side = r() < 0.5 ? -1 : 1;
          const x = side * (9 + Math.pow(r(), 1.4) * 80);
          const z = 180 - r() * 520;
          const s = 1.6 + r() * 2.4;
          const y = groundH(x, z);
          const tr = new T.Mesh(trunkGeo, trunkMat);
          tr.scale.set(1, s * 0.7, 1);
          tr.position.set(x, y + s * 0.35, z);
          road.add(tr);
          const lf = new T.Mesh(cone, leafMats[i % 3]);
          lf.scale.set(s * 0.75, s * 2.0, s * 0.75);
          lf.position.set(x, y + s * 0.7 + s, z);
          lf.rotation.y = r() * 3;
          road.add(lf);
        }
        // mountains on the horizon
        const mMats = ["#b0614c", "#c4775a", "#9a554b"].map((c) => flat(c));
        for (let i = 0; i < 26; i++) {
          const a = (i / 26) * Math.PI * 2 + r() * 0.2;
          const R = 330 + r() * 50;

      // car
      const car = new T.Group();
      road.add(car);
      const carBodyMat = flat("#2a9d8f");
      {
        const body = new T.Mesh(new T.BoxGeometry(1.9, 0.62, 4.3), carBodyMat);

        car.add(hood);
        // cabin: a side profile extruded across the car (shape x = -car z)
        function profileGeo(pts, width) {
          const s = new T.Shape();
          s.moveTo(-pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) s.lineTo(-pts[i][0], pts[i][1]);

        }
        const cabin = new T.Mesh(
          profileGeo([[-0.95, 0.96], [-0.22, 1.62], [1.0, 1.62], [1.6, 0.96]], 1.62),

        car.add(cabin);
        const glass = flat("#2f3f52");
        const sideGlass = new T.Mesh(

        const pillar = new T.Mesh(new T.BoxGeometry(1.68, 0.56, 0.12), carBodyMat);

      const hazardMat = flat("#ff9b2f");

      const wheels = [];
      function makeWheel() {
        const w = new T.Group();

      }
      const FL = [-0.86, 0.37, -1.35];
      for (const [x, z] of [[-0.86, -1.35], [0.86, -1.35], [-0.86, 1.4], [0.86, 1.4]]) {

      // hum rings around the front wheel (road)
      const ringMat = (o) => new T.MeshBasicMaterial({ color: "#ffd24a", transparent: true, opacity: o, fog: false, depthWrite: false });
      const roadRings = [];
      for (let k = 0; k < 3; k++) {
        const m = new T.Mesh(new T.TorusGeometry(1, 0.025, 3, 36), ringMat(0));
        m.rotation.y = Math.PI / 2;

      const V = 13; // m/s
      function carState(t) {
        if (t < tRoadIn) return { x: 1.8, z: -V * t, dist: V * t };
        const dt = t - tRoadIn;

        const z0 = -118;
        const k = Math.min(dt, Tst);

        const shift = E.io2(ramp(tRoadIn + 0.6, tCarStop, t));
        return { x: 1.8 + shift * 1.5, z: z0 - d, dist: 2000 + d, yaw: Math.sin(Math.PI * shift) * 0.06 };
      }


      // =========================================================
      // CLUTCH WORLD (axis = Y: engine below, gearbox above, clutch between)
      // =========================================================
      const brk = new T.Scene();
      {
        const g = new T.IcosahedronGeometry(70, 2);
        const pos = g.attributes.position;
        const colors = [];
        const top = col("#ea9662"), mid = col("#cc6b50"), bot = col("#7a3a48");
        for (let i = 0; i < pos.count; i += 3) {
          const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 / 70;
          const j = (h2(i, 3) - 0.5) * 0.06;
          const c = y > 0 ? mid.clone().lerp(top, Math.min(1, y * 1.4 + j)) : mid.clone().lerp(bot, Math.min(1, -y * 1.3 + j));
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        g.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        brk.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
      }
      brk.add(new T.HemisphereLight("#ffe6cc", "#6b3a3a", 0.85));
      const bKey = new T.DirectionalLight("#fff1dd", 1.15);
      bKey.position.set(8, 10, 9);
      brk.add(bKey);
      const bRim = new T.DirectionalLight("#b9d3ff", 0.6);
      bRim.position.set(-9, 3, -8);
      brk.add(bRim);

      const addTo = (p, geo, mat, pos, rot) => {
        const m = new T.Mesh(geo, mat);
        if (pos) m.position.set(pos[0], pos[1], pos[2]);
        if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
        p.add(m);
        return m;
      };
      const C = { lining: col("#7a5236"), burnt: col("#2e2420"), hot: col("#ff7a2f") };
      const matSteel = flat("#b9bec8");
      const matSteelD = flat("#8d929c");
      const matLight = flat("#d0d4dc");
      const matLining = flat("#7a5236");

      // engine block below, gearbox above
      const ENG_TOP = -2.7, BOX_BOT = 2.9;
      addTo(brk, new T.BoxGeometry(6.4, 2.0, 4.0), flat("#4a4d58"), [0, ENG_TOP - 1.0, 0]);
      addTo(brk, new T.BoxGeometry(6.6, 0.3, 4.2), flat("#5f6370"), [0, ENG_TOP - 0.15, 0]);
      addTo(brk, new T.CylinderGeometry(0.55, 0.55, 1.5, 8), matSteelD, [0, ENG_TOP + 0.7, 0]);
      addTo(brk, new T.BoxGeometry(5.4, 2.0, 3.6), flat("#5f6370"), [0, BOX_BOT + 1.0, 0]);
      addTo(brk, new T.CylinderGeometry(2.0, 2.6, 0.5, 10), flat("#5f6370"), [0, BOX_BOT + 0.05, 0]);

      // flywheel (engine side)
      const FW_Y = -1.0, FW_H = 0.55;
      const flywheel = new T.Group();
      flywheel.position.y = FW_Y;
      brk.add(flywheel);
      addTo(flywheel, new T.CylinderGeometry(3.1, 3.1, FW_H, 24), matSteelD);
      for (let k = 0; k < 36; k++) {
        const a = (k / 36) * Math.PI * 2;
        addTo(flywheel, new T.BoxGeometry(0.16, FW_H * 0.7, 0.22), flat("#6f747e"), [Math.cos(a) * 3.15, 0, Math.sin(a) * 3.15], [0, -a, 0]);
      }
      addTo(flywheel, new T.BoxGeometry(0.5, FW_H + 0.02, 0.18), flat("#d9483b"), [0, 0, 3.02]); // a paint mark to see it turn
      // clutch disc (gearbox side): two friction linings on a steel core, hub with torsion springs
      const disc = new T.Group();
      brk.add(disc);
      const linBot = addTo(disc, new T.CylinderGeometry(2.75, 2.75, 1, 24), matLining);
      const linTop = addTo(disc, new T.CylinderGeometry(2.75, 2.75, 1, 24), matLining);
      const core = addTo(disc, new T.CylinderGeometry(2.6, 2.6, 0.08, 24), matLight);
      addTo(disc, new T.CylinderGeometry(0.7, 0.7, 0.8, 10), matSteel);
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2;
        addTo(disc, new T.BoxGeometry(0.62, 0.3, 0.3), flat("#5a8fd6"), [Math.cos(a) * 1.3, 0.3, Math.sin(a) * 1.3], [0, -a + Math.PI / 2, 0]);
      }
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2;
        addTo(disc, new T.BoxGeometry(0.1, 0.06, 0.5), flat("#3a2a20"), [Math.cos(a) * 2.45, 0, Math.sin(a) * 2.45], [0, -a, 0]).name = "groove";
      }
      // pressure plate with diaphragm spring fingers (turns with the engine)
      const plate = new T.Group();
      brk.add(plate);
      addTo(plate, new T.CylinderGeometry(2.75, 2.75, 0.45, 24), flat("#7d828c"), [0, 0.225, 0]);
      const PP_COVER = addTo(plate, new T.CylinderGeometry(3.1, 3.1, 0.12, 24, 1, true), matSteelD, [0, 0.5, 0]);
      const fingers = [];
      for (let k = 0; k < 14; k++) {
        const a = (k / 14) * Math.PI * 2;
        const g = new T.Group();
        g.rotation.y = -a;
        plate.add(g);
        const f = addTo(g, new T.BoxGeometry(1.7, 0.08, 0.34), flat("#a7acb6"), [1.55, 0.62, 0]);
        fingers.push(f);
      }
      addTo(plate, new T.BoxGeometry(0.5, 0.47, 0.18), flat("#d9483b"), [0, 0.225, 2.7]);
      // input shaft + release bearing
      const shaft = addTo(brk, new T.CylinderGeometry(0.32, 0.32, 1, 8), matSteel);
      const bearing = addTo(brk, new T.CylinderGeometry(0.75, 0.75, 0.4, 12), flat("#2c2a30"));

      // sparks and smoke at the rim
      const r5 = rng(51);
      const sparkMat = [new T.MeshBasicMaterial({ color: "#ffd24a" }), new T.MeshBasicMaterial({ color: "#fff6c4" }), new T.MeshBasicMaterial({ color: "#ff8a3d" })];
      const sparks = Array.from({ length: 30 }, (_, i) => ({ m: addTo(brk, new T.BoxGeometry(0.09, 0.09, 0.32), sparkMat[i % 3]), a: r5() * Math.PI * 2, d: r5(), v: 0.7 + r5() * 0.6 }));
      const smokeMat = Array.from({ length: 14 }, () => new T.MeshBasicMaterial({ color: "#5d5560", transparent: true, opacity: 0, depthWrite: false }));
      const smoke = smokeMat.map((m, i) => ({ m: addTo(brk, new T.IcosahedronGeometry(0.5, 0), m), a: r5() * Math.PI * 2, d: r5(), v: 0.5 + r5() * 0.5 }));

      // what the clutch is doing at time t
      function clutchState(t) {
        let rpm = 2500, kmh = 60, slip = 0, e = 1, smokeK = 0;
        if (t < LINES.l1.end + 0.3) {
          // hook: worn clutch slips, the engine screams, the speed stays
          rpm = lerp(2600, 5800, E.out2(ramp(0, 2.4, t))) + Math.sin(t * 9) * 120;
          kmh = 40;
          slip = 1;
          smokeK = 0.45;
        } else if (t < LINES.l3.start) {
          const pressed = ramp(M.pedal - 0.1, M.pedal + 0.25, t) * (1 - ramp(M.schalten + 0.1, M.schalten + 0.5, t));
          e = 1 - pressed;
          rpm = lerp(2500, 1100, pressed);
        } else if (t < LINES.l4.start) {
          rpm = 1600;
          kmh = 30;
          const sl = ramp(M.schleifen - 0.1, M.schleifen + 0.2, t) * (1 - ramp(LINES.l3.end, LINES.l3.end + 0.3, t));
          slip = sl * 0.6;
        } else {
          slip = ramp(M.rutscht - 0.2, M.rutscht + 0.1, t);
          rpm = lerp(2500, 5600, E.out2(ramp(M.rutscht, M.drehzahl + 0.3, t))) + Math.sin(t * 9) * 120 * slip;
          kmh = 50;
          smokeK = Math.max(0.3 * slip, ramp(M.verbrannt - 0.3, M.verbrannt + 0.2, t));
        }
        return { rpm, kmh, slip, e, smokeK };
      }
      // wear of the linings (0 new … 1 worn)
      function wear(t) {
        if (t < LINES.l1.end + 0.3) return 0.85;
        if (t < LINES.l3.start) return 0;
        if (t < LINES.l4.start) return 0.85 * E.io2(ramp(M.reibbelag + 0.3, M.duenner + 0.4, t));
        return 0.85;
      }
      // integrated rotation (rev) of engine side and disc side
      const HZ = 120;
      const engTable = new Float32Array(Math.ceil((DUR + 1) * HZ) + 2);
      const discTable = new Float32Array(engTable.length);
      for (let i = 1; i < engTable.length; i++) {
        const s = clutchState(i / HZ);
        const ev = (s.rpm / 1000) * 0.55;
        const dv = ev * s.e * (1 - s.slip * 0.85);
        engTable[i] = engTable[i - 1] + ev / HZ;
        discTable[i] = discTable[i - 1] + dv / HZ;
      }
      const at = (tab, t) => {
        const f = Math.max(0, Math.min(tab.length - 2, t * HZ));
        const i = Math.floor(f);
        return lerp(tab[i], tab[i + 1], f - i);
      };
      const rpmEl = document.getElementById("meter-rpm");
      const kmhEl = document.getElementById("meter-kmh");

      // =========================================================
      // CAMERA PATHS
      // =========================================================
      const brkKeys = [
        { t: 0, p: [6.0, 3.2, 11.5], l: [0, -0.6, 0] }, // frame 0: the slipping clutch, sparks and smoke
        { t: M.kupplung - 0.15, p: [5.2, 2.8, 10.5], l: [0, -0.5, 0], e: "lin" },
        { t: M.kupplung + 0.6, p: [4.6, 2.2, 9.0], l: [0, -0.4, 0], e: "out3" },
        { t: M.motor - 0.1, p: [5.8, 0.6, 15.0], l: [0, -0.9, 0], e: "io" },
        { t: M.pedal - 0.3, p: [5.6, 0.6, 14.6], l: [0, -0.9, 0], e: "lin" },
        { t: M.pedal + 0.4, p: [7.2, 0.4, 7.6], l: [0, -0.3, 0], e: "io" },
        { t: LINES.l2.end, p: [7.0, 0.4, 7.4], l: [0, -0.3, 0], e: "lin" },
        { t: LINES.l3.start + 0.6, p: [3.4, 1.4, 11.0], l: [0.2, -1.1, 0.6], e: "io" },
        { t: LINES.l3.end, p: [3.2, 1.3, 10.4], l: [0.2, -1.1, 0.6], e: "lin" },
        { t: LINES.l4.start + 0.5, p: [-5.6, 3.0, 11.5], l: [0, -0.7, 0], e: "io" },
        { t: tRoadIn, p: [-5.2, 2.8, 10.8], l: [0, -0.7, 0], e: "lin" },
      ];
      const roadKeys = [
        { t: tRoadIn, p: [-3.2, 1.0, -7.5], l: [0, 0.7, -0.5] },
        { t: tCarStop, p: [-6.5, 2.4, -10.5], l: [0, 0.9, -0.3], e: "out3" },
        { t: DUR, p: [-7.2, 2.8, -11.4], l: [0, 1.0, -0.3], e: "lin" },
      ];
      function sample(keys, t) {
        if (t <= keys[0].t) return keys[0];
        for (let i = 1; i < keys.length; i++) {
          const b = keys[i];
          if (t <= b.t) {
            const a = keys[i - 1];
            const k = E[b.e || "io"](clamp01((t - a.t) / Math.max(1e-3, b.t - a.t)));
            return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l.map((v, j) => lerp(v, b.l[j], k)) };
          }
        }
        return keys[keys.length - 1];
      }

      // =========================================================
      // LABELS + STRIP (HTML)
      // =========================================================
      const v3 = new T.Vector3();
      const labelWin = {};
      let nowT = 0;
      function place(id, world) {
        const el = document.getElementById(id);
        const w = labelWin[id];
        const on = w && nowT >= w[0] - 0.02 && nowT <= w[1] + 0.02;
        el.style.visibility = on ? "visible" : "hidden";
        if (!on) return;
        v3.copy(world).project(camera);
        const x = Math.max(200, Math.min(880, (v3.x * 0.5 + 0.5) * 1080));
        const y = (-v3.y * 0.5 + 0.5) * 1920;
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      }

      const SLOT = 200; // px between icon centres
      const N = 9;
      const slots = Array.from({ length: N }, (_, i) => document.getElementById("slot-" + i));
      const shards = Array.from(document.querySelectorAll("#strip-wrap .shard"));
      const shardDir = shards.map((_, i) => {
        const a = (i / shards.length) * Math.PI * 2 + 0.3;
        return [Math.cos(a), Math.sin(a) * 0.8 - 0.35, 0.7 + h2(i, 9) * 0.6];
      });
      // slot-machine ease: very fast at p=0, slight overshoot, settle
      const reel = (p) => {
        const c1 = 0.9, c3 = c1 + 1;
        const q = p - 1;
        return 1 + c3 * q * q * q + c1 * q * q;
      };
      function stripOffset(t, target, t0, t1, loops) {
        const p = clamp01((t - t0) / (t1 - t0));
        return target * SLOT - (1 - reel(p)) * loops * N * SLOT;
      }
      function drawStrip(off, burstT) {
        const W = N * SLOT;
        slots.forEach((el, i) => {
          let x = i * SLOT - off;
          x = ((((x + W / 2) % W) + W) % W) - W / 2;
          el.style.transform = `translateX(${(540 + x).toFixed(1)}px)`;
        });
        shards.forEach((el, i) => {
          const k = clamp01(burstT / 0.7);
          const on = burstT > 0 && k < 1;
          el.style.opacity = on ? (1 - k).toFixed(3) : "0";
          if (!on) return;
          const d = shardDir[i];
          const dist = E.out3(k) * 330 * d[2];
          el.style.transform = `translate(${(d[0] * dist).toFixed(1)}px, ${(d[1] * dist + k * k * 140).toFixed(1)}px) rotate(${(k * 540 + i * 40).toFixed(0)}deg)`;
        });
      }

      // =========================================================
      // RENDER
      // =========================================================
      const iris = document.getElementById("world-iris");
      const kicker = document.getElementById("strip-kicker");
      const word = document.getElementById("strip-word");

      function render(t) {
        nowT = t;
        // iris for the cut to the road
        iris.style.opacity = (ramp(tRoadIn - 0.22, tRoadIn, t) * (1 - ramp(tRoadIn, tRoadIn + 0.35, t))).toFixed(3);

        // strip: opening (today) and closing (next)
        drawStrip(stripOffset(t, 8, tOutroSpin, tOutroStop, 2), t - tOutroStop);
        word.textContent = t >= tOutroStop - 0.02 ? "Lichtmaschine" : "…";

        const inRoad = t >= tRoadIn;
        let shake = 0;
        if (!inRoad) {
          const s = clutchState(t);
          const w = wear(t);
          const Lt = lerp(0.22, 0.06, w);
          // stack: flywheel top → lining → core → lining → (gap) → pressure plate
          const fwTop = FW_Y + FW_H / 2;
          const gap = (1 - s.e) * 0.5;
          const discGap = gap * 0.4; // the disc floats a little off the flywheel
          const coreY = fwTop + discGap + Lt + 0.04;
          disc.position.y = coreY;
          linBot.scale.set(1, Lt, 1);
          linBot.position.y = -0.04 - Lt / 2;
          linTop.scale.set(1, Lt, 1);
          linTop.position.y = 0.04 + Lt / 2;
          const ppY = coreY + 0.04 + Lt + gap * 0.6;
          plate.position.y = ppY;
          const engRot = at(engTable, t) * Math.PI * 2;
          const discRot = at(discTable, t) * Math.PI * 2;
          flywheel.rotation.y = engRot;
          plate.rotation.y = engRot;
          disc.rotation.y = discRot;
          const shaftBot = coreY, shaftTop = BOX_BOT + 0.2;
          shaft.position.y = (shaftBot + shaftTop) / 2;
          shaft.scale.y = shaftTop - shaftBot;
          // the release bearing pushes the finger tips down when the pedal is pressed
          const push = 1 - s.e;
          bearing.position.y = ppY + 1.05 - push * 0.35;
          fingers.forEach((f) => (f.rotation.z = -0.12 + push * 0.22));
          // linings: browner when new, darker and glazed when worn, glowing while slipping hard
          matLining.color.copy(C.lining).lerp(C.burnt, w * 0.6).lerp(C.hot, s.slip * 0.35);
          // sparks fly off the rim while it slips
          sparks.forEach((sp, i) => {
            const k = (((t * 1.6 * sp.v + sp.d) % 1) + 1) % 1;
            const on = s.slip > 0.3 && k < 0.55;
            sp.m.visible = on;
            if (!on) return;
            const a = sp.a + discRot * 0.2;
            const r = 2.8 + E.out3(k / 0.55) * 2.4 * sp.v;
            sp.m.position.set(Math.cos(a) * r, coreY - k * k * 2.2, Math.sin(a) * r);
            sp.m.rotation.y = -a;
            sp.m.rotation.x = 0.4;
          });
          smoke.forEach((sm, i) => {
            const k = (((t * 0.32 * sm.v + sm.d) % 1) + 1) % 1;
            sm.m.visible = s.smokeK > 0.02;
            if (!sm.m.visible) return;
            const r = 2.9 + k * 0.8;
            sm.m.position.set(Math.cos(sm.a) * r, coreY + k * 4.2, Math.sin(sm.a) * r);
            sm.m.scale.setScalar(0.5 + k * 1.6);
            sm.m.material.opacity = s.smokeK * 0.75 * Math.sin(Math.PI * k);
          });

          // the engine shakes the picture while it screams
          shake = s.slip > 0.5 ? 0.04 * s.slip : 0;
          const cam = sample(brkKeys, t);
          const sx = Math.sin(t * 61) * shake, sy = Math.sin(t * 47) * shake * 1.4;
          camera.position.set(cam.p[0] + sx, cam.p[1] + sy, cam.p[2]);
          camera.lookAt(cam.l[0] + sx * 0.5, cam.l[1] + sy, cam.l[2]);
          camera.updateMatrixWorld();
          brk.updateMatrixWorld(true);
          renderer.render(brk, camera);

          // the dashboard overlay
          rpmEl.textContent = (Math.round(s.rpm / 100) * 100).toLocaleString("de-DE");
          rpmEl.style.color = s.rpm > 4500 ? "#ff7b6b" : "#ffffff";
          kmhEl.textContent = Math.round(s.kmh) + " km/h";

          place("lbl-kupplung", new T.Vector3(1.2, coreY, 2.5));
          place("lbl-motor", new T.Vector3(-1.6, ENG_TOP - 0.1, 2.0));
          place("lbl-getriebe", new T.Vector3(1.2, BOX_BOT + 0.5, 1.8));
          place("lbl-pedal", new T.Vector3(0.2, ppY + 1.1, 0.6));
          place("lbl-scheibe", new T.Vector3(1.0, coreY, 2.6));
          place("lbl-belag", new T.Vector3(0.6, coreY + 0.04 + Lt / 2, 2.72));
          place("lbl-rutscht", new T.Vector3(-0.2, coreY, 2.75));
          place("lbl-verbrannt", new T.Vector3(-0.4, coreY + 2.6, 1.2));
          place("lbl-oben", new T.Vector3(0.6, ppY + 1.1, 0.6));
        } else {
          document.querySelectorAll("#root .lbl").forEach((el) => (el.style.visibility = "hidden"));
          const s = carState(t);
          car.position.set(s.x, 0, s.z);
          car.rotation.y = s.yaw || 0;
          const roll = -s.dist / 0.37;
          wheels.forEach((w) => (w.rotation.x = w.rotation.y ? -roll : roll));
          car.position.y = Math.sin(s.dist * 1.7) * 0.012;
          // nose dips while braking
          const braking = ramp(tRoadIn, tRoadIn + 0.3, t) * (1 - ramp(tCarStop - 0.2, tCarStop + 0.4, t));
          const jerkRoad = t < tCarStop ? (h2(Math.floor(t * 3), 3) > 0.55 ? Math.sin(((t * 3) % 1) * Math.PI) : 0) : 0;
          car.rotation.x = -0.035 * braking + 0.03 * jerkRoad;
          car.position.z += 0.25 * jerkRoad;
          const stopped = t > tCarStop - 0.3;
          hazards.forEach((h) => (h.visible = stopped && Math.floor((t - tCarStop) * 1.6) % 2 === 0));
          roadRings.forEach((m) => (m.visible = false));
          const c = sample(roadKeys, t);
          car.updateMatrixWorld(true);
          camera.position.copy(car.localToWorld(new T.Vector3(c.p[0], c.p[1], c.p[2])));
          camera.lookAt(car.localToWorld(new T.Vector3(c.l[0], c.l[1], c.l[2])));
          camera.updateMatrixWorld();
          renderer.render(road, camera);
        }
      }

      // =========================================================
      // TIMELINE
      // =========================================================
      const tl = gsap.timeline({ paused: true });
      const state = { t: 0 };
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);

      function showLabel(id, a, b) {
        labelWin[id] = [a, b];
        tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, a);
        tl.fromTo("#" + id + " .txt", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, a);
        tl.to("#" + id, { opacity: 0, duration: 0.15, ease: "power2.in" }, b - 0.15);
      }
      showLabel("lbl-kupplung", M.kupplung, M.motor - 0.05);
      showLabel("lbl-motor", M.motor, M.pedal - 0.05);
      showLabel("lbl-getriebe", M.getriebe, M.pedal - 0.05);
      showLabel("lbl-pedal", M.pedal, LINES.l2.end + 0.25);
      showLabel("lbl-scheibe", M.scheibe, M.reibbelag - 0.05);
      showLabel("lbl-belag", M.reibbelag, LINES.l3.end + 0.25);
      showLabel("lbl-rutscht", M.rutscht, LINES.l4.end + 0.3);
      showLabel("lbl-verbrannt", M.verbrannt, M.oben - 0.05);
      showLabel("lbl-oben", M.oben, LINES.l4.end + 0.3);

      // dashboard: the slipping clutch in the hook and again in l4
      [[0, LINES.l1.end + 0.3], [M.rutscht - 0.3, tRoadIn - 0.25]].forEach(([a, b], k) => {
        tl.fromTo("#meter", { opacity: k ? 0 : 1 }, { opacity: 1, duration: k ? 0.2 : 0.01, immediateRender: !k }, a);
        tl.to("#meter", { opacity: 0, duration: 0.2 }, b);
      });
      tl.set("#meter", { visibility: "hidden" }, tRoadIn);

      // follow hint early in the film, so more than the 2-3 % who reach the end see it
      const tHint = M.motor + 1.0;
      tl.fromTo("#follow-hint", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, tHint);
      tl.to("#fh-plus", { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, tHint + 0.5);
      tl.to("#follow-hint", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, tHint + 3.4);
      tl.set("#follow-hint", { visibility: "hidden" }, tHint + 3.7);

      // hook plate: on screen from frame 0
      tl.fromTo("#plate-hook", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#plate-hook .plate", { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.to("#plate-hook", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, M.kupplung - 0.2);

      // closing strip over a dimmed road
      tl.fromTo("#strip-dim", { opacity: 0 }, { opacity: 0.55, duration: 0.3 }, tOutroSpin - 0.15);
      tl.fromTo("#strip-wrap", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, tOutroSpin - 0.15);
      tl.fromTo("#strip-word", { scale: 0.7 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, tOutroStop);
      tl.to("#strip-ring", { scale: 1.18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, tOutroStop);

      // Werkstatt plate
      tl.fromTo("#plate-werkstatt", { opacity: 0 }, { opacity: 1, duration: 0.1 }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt .plate", { y: 50, clipPath: "inset(0 0 100% 0)" }, { y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power4.out" }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, M.werkstatt + 0.15);
      tl.to("#plate-werkstatt", { opacity: 0, duration: 0.2 }, tOutroSpin - 0.2);

      // follow card
      tl.fromTo("#follow", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tFollow);
      tl.set(["#strip-wrap", "#strip-dim"], { visibility: "hidden" }, tFollow + 0.21);
      tl.fromTo("#follow-pic", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, tFollow);
      tl.fromTo("#follow-text", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, tFollow + 0.15);
      tl.fromTo("#follow-hand", { x: 160, y: 200, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, tFollow + 0.3);
      tl.to("#follow-hand", { scale: 0.86, transformOrigin: "40% 0%", duration: 0.1, ease: "power2.in" }, tFollow + 0.85);
      tl.to("#follow-hand", { scale: 1, duration: 0.15, ease: "power2.out" }, tFollow + 0.95);
      tl.fromTo("#follow-plus", { scale: 1, backgroundColor: "#ffd24a" }, { scale: 1.25, backgroundColor: "#2a9d8f", duration: 0.12, ease: "power2.out" }, tFollow + 0.9);
      tl.to("#follow-plus", { scale: 1, duration: 0.2, ease: "back.out(2)" }, tFollow + 1.02);
      tl.set("#follow-plus", { textContent: "✓" }, tFollow + 0.95);

      render(0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
