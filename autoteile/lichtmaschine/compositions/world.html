  <script>
    (function () {
      /*TIMING*/ const LINES = {"l1":{"start":0.3,"end":4.429},"l2":{"start":4.581,"end":7.943},"l3":{"start":8.326,"end":10.617},"l4":{"start":11.002,"end":15.383},"l5":{"start":15.989,"end":19.23},"l6":{"start":19.31,"end":22.106}}; const M = {"leer":1.835,"lima":3.682,"keilriemen":4.742,"strom":6.448,"laedt":7.054,"buersten":9.376,"lager":10.133,"lampe":11.718,"flackert":13,"stehen":14.929,"werkstatt":16.332,"auto":17.362,"kommentare":18.886,"folg":19.31,"naechstes":20.047,"ziel":21.49}; /*END TIMING*/
      const DUR = 25.4;
      const T = THREE;
      // ---------- helpers (deterministic)
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (a, b, t) => clamp01((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const E = {
        lin: (x) => x,
        io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
        io2: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
        in3: (x) => x * x * x,
        out3: (x) => 1 - Math.pow(1 - x, 3),
        out2: (x) => 1 - (1 - x) * (1 - x),
      };
      function h2(x, y) {
        let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        n ^= n >>> 16;
        return (n >>> 0) / 4294967296;
      }
      function vnoise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const flat = (color, extra) => new T.MeshLambertMaterial(Object.assign({ color, flatShading: true }, extra || {}));
      const col = (h) => new T.Color(h);

      // ---------- timing derived from the voice
      const tRoadIn = LINES.l5.start - 0.05; // cut to the road (iris)
      const tCarStop = tRoadIn + 2.6;
      const tOutroSpin = M.naechstes - 0.25; // the strip appears only at the end
      const tOutroStop = M.ziel + 0.05;
      const tFollow = Math.max(tOutroStop + 0.9, LINES.l6.end + 0.25);

      // ---------- renderer (portrait)
      const canvas = document.getElementById("world-canvas");
      const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      const camera = new T.PerspectiveCamera(50, 1080 / 1920, 0.03, 1400);

      // =========================================================
      // ROAD WORLD
      // =========================================================
      const road = new T.Scene();
      const FOG = "#f6b47a";
      road.fog = new T.Fog(FOG, 45, 420);
      road.add(new T.HemisphereLight("#ffe0b8", "#5a4636", 0.95));
      const sunLight = new T.DirectionalLight("#ffc890", 1.25);
      sunLight.position.set(60, 40, 120);
      road.add(sunLight);

      // sky dome, faceted
      {
        const g = new T.SphereGeometry(700, 18, 12).toNonIndexed();
        const pos = g.attributes.position;
        const colors = [];
        const top = col("#d9685a"), mid = col("#f08f5e"), hor = col(FOG);
        for (let i = 0; i < pos.count; i += 3) {
          const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 / 700;
          const c = y < 0.08 ? hor.clone() : y < 0.4 ? hor.clone().lerp(mid, (y - 0.08) / 0.32) : mid.clone().lerp(top, Math.min(1, (y - 0.4) / 0.5));
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        g.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        road.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false })));
        const sun = new T.Mesh(new T.CircleGeometry(34, 10), new T.MeshBasicMaterial({ color: "#ffe2a0", fog: false }));
        sun.position.set(150, 70, 560);
        sun.lookAt(0, 0, 0);
        road.add(sun);
      }

      function groundH(x, z) {
        const d = Math.abs(x);
        if (d < 6) return -0.02;
        const k = Math.min(1, (d - 6) / 14);
        return (d - 6) * 0.09 + k * (vnoise(x * 0.045, z * 0.045) * 9 + vnoise(x * 0.16, z * 0.16) * 1.6) - 0.02;
      }
      // terrain
      {
        const g = new T.PlaneGeometry(280, 560, 70, 140);
        g.rotateX(-Math.PI / 2);
        g.translate(0, 0, -80);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
        const ng = g.toNonIndexed();
        ng.computeVertexNormals();
        const q = ng.attributes.position;
        const greens = ["#6f9a52", "#5f8a49", "#82a85c", "#73a058"].map(col);
        const high = col("#b39a58"), peak = col("#c98552");
        const colors = [];
        for (let i = 0; i < q.count; i += 3) {
          const cx = (q.getX(i) + q.getX(i + 1) + q.getX(i + 2)) / 3;
          const cz = (q.getZ(i) + q.getZ(i + 1) + q.getZ(i + 2)) / 3;
          const cy = (q.getY(i) + q.getY(i + 1) + q.getY(i + 2)) / 3;
          let c = greens[Math.floor(h2(Math.round(cx * 3), Math.round(cz * 3)) * 4)].clone();
          if (cy > 5) c.lerp(high, Math.min(1, (cy - 5) / 5));
          if (cy > 10) c.lerp(peak, Math.min(1, (cy - 10) / 5));
          if (Math.abs(cx) < 4.6) c = col("#8a7a5c");
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        ng.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        road.add(new T.Mesh(ng, new T.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
      }
      // asphalt + markings
      {
        const asphalt = new T.Mesh(new T.PlaneGeometry(7.8, 560), flat("#4b4853"));
        asphalt.rotation.x = -Math.PI / 2;
        asphalt.position.set(0, 0.01, -80);
        road.add(asphalt);
        const lineMat = flat("#f1ede2");
        for (const x of [-3.6, 3.6]) {
          const m = new T.Mesh(new T.PlaneGeometry(0.14, 560), lineMat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(x, 0.02, -80);
          road.add(m);
        }
        const dashMat = flat("#f1ede2");
        const dashGeo = new T.PlaneGeometry(0.14, 3);
        for (let z = 190; z > -350; z -= 8) {
          const m = new T.Mesh(dashGeo, dashMat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(0, 0.02, z);
          road.add(m);
        }
      }
      // trees
      {
        const r = rng(7);
        const leafMats = ["#2f6b4f", "#3c7a52", "#4f8a4f"].map((c) => flat(c));
        const trunkMat = flat("#6b4430");
        const cone = new T.ConeGeometry(1, 1, 6);
        const trunkGeo = new T.CylinderGeometry(0.18, 0.24, 1, 5);
        for (let i = 0; i < 230; i++) {
          const side = r() < 0.5 ? -1 : 1;
          const x = side * (9 + Math.pow(r(), 1.4) * 80);
          const z = 180 - r() * 520;

      const V = 13; // m/s

      // =========================================================

      // =========================================================
      const brk = new T.Scene();

      const matSteel = flat("#b9bec8");

      addTo(lima, new T.CylinderGeometry(1.7, 1.7, 2.4, 16, 1, true), matHouse, [0, 0, 0], [Math.PI / 2, 0, 0]);
      for (let k = 0; k < 7; k++) addTo(lima, new T.TorusGeometry(1.7, 0.07, 3, 20), matHouseD, [0, 0, -1.05 + k * 0.35]);
      addTo(lima, new T.CylinderGeometry(1.7, 1.7, 0.12, 16), matHouseD, [0, 0, -1.2], [Math.PI / 2, 0, 0]);
      // rotor (claw poles + copper winding) on the shaft
      const rotor = new T.Group();
      lima.add(rotor);
      addTo(rotor, new T.CylinderGeometry(0.18, 0.18, 3.6, 8), matSteel, [0, 0, 0.3], [Math.PI / 2, 0, 0]);
      addTo(rotor, new T.CylinderGeometry(0.85, 0.85, 1.0, 12), matCopper, [0, 0, 0], [Math.PI / 2, 0, 0]);
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2;
        addTo(rotor, new T.BoxGeometry(0.5, 0.18, 1.3), matSteelD, [Math.cos(a) * 1.0, Math.sin(a) * 1.0, 0], [0, 0, a]);
      }
      // slip rings at the back
      for (const z of [-0.75, -0.95]) addTo(rotor, new T.CylinderGeometry(0.3, 0.3, 0.12, 10), flat("#d39a62"), [0, 0, z], [Math.PI / 2, 0, 0]);
      // carbon brushes press on the slip rings from above (they get shorter)
      const brushes = [-0.75, -0.95].map((z) => {
        const b = addTo(lima, new T.BoxGeometry(0.2, 1, 0.16), matDark);
        b.userData.z = z;
        return b;
      });
      const brushHolder = addTo(lima, new T.BoxGeometry(0.42, 0.3, 0.5), flat("#3d3a43"), [0, 1.25, -0.85]);
      // bearings at both ends
      const bearings = [1.1, -1.1].map((z) => addTo(lima, new T.TorusGeometry(0.3, 0.09, 4, 12), flat("#eef0f4"), [0, 0, z]));
      // pulley + fan in front
      const pulley = new T.Group();
      pulley.position.set(0, 0, 1.75);
      lima.add(pulley);
      addTo(pulley, new T.CylinderGeometry(0.55, 0.55, 0.5, 12), flat("#5f6370"), [0, 0, 0], [Math.PI / 2, 0, 0]);
      for (let k = 0; k < 3; k++) addTo(pulley, new T.TorusGeometry(0.56, 0.035, 3, 14), flat("#3a3840"), [0, 0, -0.15 + k * 0.15]);
      for (let k = 0; k < 8; k++) addTo(pulley, new T.BoxGeometry(0.16, 1.5, 0.08), matSteel, [0, 0, -0.42], [0, 0, (k / 8) * Math.PI]);
      // B+ terminal (red) at the back
      addTo(lima, new T.CylinderGeometry(0.16, 0.16, 0.5, 8), matRed, [-1.0, 1.0, -1.25], [Math.PI / 2, 0, 0]);

      // ---- crank pulley + belt (belt runs in the plane z = BELT_Z)
      const BELT_Z = LIMA.z + 1.75;
      const CRANK = new T.Vector3(1.0, -1.6, BELT_Z);
      const R_A = 0.6, R_C = 1.15;
      addTo(brk, new T.CylinderGeometry(R_C - 0.05, R_C - 0.05, 0.5, 16), flat("#5f6370"), [CRANK.x, CRANK.y, CRANK.z], [Math.PI / 2, 0, 0]);
      const crankHub = addTo(brk, new T.BoxGeometry(0.3, 1.6, 0.1), matSteel, [CRANK.x, CRANK.y, CRANK.z + 0.28]);
      addTo(brk, new T.BoxGeometry(5.0, 2.2, 3.0), flat("#4a4d58"), [CRANK.x + 0.5, CRANK.y - 0.6, CRANK.z - 2.0]);
      // belt path: around both pulleys (outer tangents approximated by sampling)
      const beltPts = [];
      {
        const A = new T.Vector2(LIMA.x, LIMA.y), Cc = new T.Vector2(CRANK.x, CRANK.y);

      const cablePath = new T.CatmullRomCurve3([
        new T.Vector3(LIMA.x - 1.0, LIMA.y + 1.0, LIMA.z - 1.5), new T.Vector3(-2.4, 2.6, -1.2), new T.Vector3(-3.0, -0.8, -0.6), new T.Vector3(-2.7, -2.6, -0.3), new T.Vector3(-2.6, -3.0, -0.3),
      ]);
      addTo(brk, new T.TubeGeometry(cablePath, 40, 0.13, 6), flat("#c8392d"));
      const pelletGeo = new T.BoxGeometry(0.24, 0.24, 0.24);
      const pelletMat = new T.MeshBasicMaterial({ color: "#ffd24a" });
      const pellets = Array.from({ length: 10 }, () => addTo(brk, pelletGeo, pelletMat));

      // sparks at the worn brushes
      const r6 = rng(61);
      const sparkMats = ["#ffd24a", "#fff6c4", "#ff8a3d"].map((c) => new T.MeshBasicMaterial({ color: c }));
      const sparks = Array.from({ length: 18 }, (_, i) => ({ m: addTo(brk, new T.BoxGeometry(0.07, 0.07, 0.22), sparkMats[i % 3]), a: r6() * Math.PI * 2, d: r6(), v: 0.6 + r6() * 0.7 }));

      // ---- what the alternator does at time t
      function limaState(t) {
        // charge: 1 = charging fine; wear: brushes/bearings 0..1; sparks; flicker
        if (t < LINES.l1.end + 0.3) return { charge: 0, wear: 1, sparks: 1, flicker: 0.6 };
        if (t < LINES.l3.start) return { charge: ramp(M.strom - 0.2, M.strom + 0.2, t), wear: 0, sparks: 0, flicker: 0 };
        if (t < LINES.l4.start) return { charge: 0.5, wear: E.io2(ramp(M.buersten, M.lager + 0.4, t)), sparks: ramp(M.lager, M.lager + 0.2, t), flicker: 0 };
        return { charge: 0, wear: 1, sparks: 0.7, flicker: ramp(M.flackert - 0.1, M.flackert + 0.1, t) };
      }
      // the battery voltage as the meter shows it
      function volts(t) {

      }
      const meterVal = document.getElementById("meter-val");
      const meterNote = document.getElementById("meter-note");

      // =========================================================
      // CAMERA PATHS

      const brkKeys = [
        { t: 0, p: [7.0, 1.8, 11.0], l: [-0.2, 0.3, 0] }, // frame 0: sparking alternator, belt, the battery below
        { t: M.lima - 0.15, p: [6.4, 1.8, 10.0], l: [-0.2, 0.6, 0], e: "lin" },

        if (t <= keys[0].t) return keys[0];
        for (let i = 1; i < keys.length; i++) {
          const b = keys[i];
          if (t <= b.t) {
            const a = keys[i - 1];
            const k = E[b.e || "io"](clamp01((t - a.t) / Math.max(1e-3, b.t - a.t)));

        return keys[keys.length - 1];

      // =========================================================

      const v3 = new T.Vector3();

      let nowT = 0;

        v3.copy(world).project(camera);
        const x = Math.max(200, Math.min(880, (v3.x * 0.5 + 0.5) * 1080));

      const SLOT = 200; // px between icon centres
      const N = 9;
      const slots = Array.from({ length: N }, (_, i) => document.getElementById("slot-" + i));
      const shards = Array.from(document.querySelectorAll("#strip-wrap .shard"));
      const shardDir = shards.map((_, i) => {
        const a = (i / shards.length) * Math.PI * 2 + 0.3;
        return [Math.cos(a), Math.sin(a) * 0.8 - 0.35, 0.7 + h2(i, 9) * 0.6];
      });
      // slot-machine ease: very fast at p=0, slight overshoot, settle
      const reel = (p) => {
        const c1 = 0.9, c3 = c1 + 1;
        const q = p - 1;
        return 1 + c3 * q * q * q + c1 * q * q;
      };
      function stripOffset(t, target, t0, t1, loops) {
        const p = clamp01((t - t0) / (t1 - t0));
        return target * SLOT - (1 - reel(p)) * loops * N * SLOT;
      }
      function drawStrip(off, burstT) {
        const W = N * SLOT;
        slots.forEach((el, i) => {
          let x = i * SLOT - off;
          x = ((((x + W / 2) % W) + W) % W) - W / 2;
          el.style.transform = `translateX(${(540 + x).toFixed(1)}px)`;
        });
        shards.forEach((el, i) => {
          const k = clamp01(burstT / 0.7);
          const on = burstT > 0 && k < 1;
          el.style.opacity = on ? (1 - k).toFixed(3) : "0";
          if (!on) return;
          const d = shardDir[i];
          const dist = E.out3(k) * 330 * d[2];
          el.style.transform = `translate(${(d[0] * dist).toFixed(1)}px, ${(d[1] * dist + k * k * 140).toFixed(1)}px) rotate(${(k * 540 + i * 40).toFixed(0)}deg)`;
        });
      }

      // =========================================================
      // RENDER
      // =========================================================
      const iris = document.getElementById("world-iris");
      const kicker = document.getElementById("strip-kicker");
      const word = document.getElementById("strip-word");

      function render(t) {
        nowT = t;
        // iris for the cut to the road
        iris.style.opacity = (ramp(tRoadIn - 0.22, tRoadIn, t) * (1 - ramp(tRoadIn, tRoadIn + 0.35, t))).toFixed(3);

        // strip: opening (today) and closing (next)
        drawStrip(stripOffset(t, 8, tOutroSpin, tOutroStop, 2), t - tOutroStop);
        word.textContent = t >= tOutroStop - 0.02 ? "Selbst prüfen!" : "…";

        const inRoad = t >= tRoadIn;
        let shake = 0;
        if (!inRoad) {
          const s = limaState(t);
          const spin = t * 5.5; // the engine runs throughout
          const wob = s.wear * 0.04 * Math.sin(t * 37);
          rotor.rotation.z = -spin * Math.PI * 2 * (R_C / R_A);
          rotor.position.set(wob, wob * 0.6, 0);
          pulley.rotation.z = rotor.rotation.z;
          crankHub.rotation.z = -spin * Math.PI * 2;
          // belt markers run along the belt
          beltMarks.forEach((m, i) => {
            const u = (((i / beltMarks.length - spin * 0.32) % 1) + 1) % 1;
            m.position.copy(beltCurve.getPointAt(u));
          });
          // brushes: long when new, short stubs when worn
          const bl = lerp(0.9, 0.28, s.wear);
          brushes.forEach((b) => {
            b.scale.y = bl;
            b.position.set(0, 0.3 + bl / 2, b.userData.z);
          });
          brushHolder.position.y = 0.3 + 0.9 + 0.15;
          bearings.forEach((b) => b.position.set(wob * 1.5, wob, b.position.z));
          // current to the battery while it charges
          pellets.forEach((m, i) => {
            m.visible = s.charge > 0.05;
            if (!m.visible) return;
            const u = (((i / pellets.length + t * 0.5) % 1) + 1) % 1;
            m.position.copy(cablePath.getPointAt(u));
            m.scale.setScalar(0.4 + 0.6 * s.charge);
          });
          // sparks at the worn brushes
          sparks.forEach((sp) => {
            const k = (((t * 2.2 * sp.v + sp.d) % 1) + 1) % 1;
            const on = s.sparks > 0.2 && k < 0.5;
            sp.m.visible = on;
            if (!on) return;
            const r = E.out3(k / 0.5) * 1.3 * sp.v;
            sp.m.position.set(LIMA.x + 0.2 + Math.cos(sp.a) * r * 0.5 + r * 0.6, LIMA.y + 0.4 + Math.sin(sp.a) * r * 0.6 - k * k * 0.8, LIMA.z - 0.85 + Math.cos(sp.a * 3) * 0.3);
            sp.m.rotation.y = sp.a;
          });
          // the light flickers when the alternator fails
          const fl = s.flicker * (h2(Math.floor(t * 14), 5) > 0.55 ? 0.55 : 0);
          bHemi.intensity = 0.85 * (1 - fl);
          bKey.intensity = 1.15 * (1 - fl);

          shake = s.sparks > 0.5 ? 0.025 : 0;
          const cam = sample(brkKeys, t);
          const sx = Math.sin(t * 61) * shake, sy = Math.sin(t * 47) * shake * 1.4;
          camera.position.set(cam.p[0] + sx, cam.p[1] + sy, cam.p[2]);
          camera.lookAt(cam.l[0] + sx * 0.5, cam.l[1] + sy, cam.l[2]);
          camera.updateMatrixWorld();
          brk.updateMatrixWorld(true);
          renderer.render(brk, camera);

          const v = volts(t);
          meterVal.textContent = v.toFixed(1).replace(".", ",") + " V";
          meterNote.textContent = v >= 13.5 ? "lädt" : v >= 12.3 ? "gut" : v >= 11.8 ? "schwach" : "leer";
          meterVal.style.color = v >= 13.5 ? "#6fe39a" : v >= 12.3 ? "#ffffff" : v >= 11.8 ? "#ffd24a" : "#ff7b6b";

          place("lbl-lima", new T.Vector3(LIMA.x - 0.6, LIMA.y + 1.7, LIMA.z));
          place("lbl-riemen", new T.Vector3(CRANK.x + 0.9, (LIMA.y + CRANK.y) / 2, BELT_Z));
          place("lbl-strom", new T.Vector3(-3.0, -0.8, -0.6));
          place("lbl-buersten", new T.Vector3(0.1, LIMA.y + 0.9, LIMA.z - 0.85));
          place("lbl-lager", new T.Vector3(0.2, LIMA.y + 0.3, LIMA.z + 1.1));
          place("lbl-flackert", new T.Vector3(-0.6, LIMA.y + 1.7, LIMA.z));
        } else {
          document.querySelectorAll("#root .lbl").forEach((el) => (el.style.visibility = "hidden"));
          const s = carState(t);
          car.position.set(s.x, 0, s.z);
          car.rotation.y = s.yaw || 0;
          const roll = -s.dist / 0.37;
          wheels.forEach((w) => (w.rotation.x = w.rotation.y ? -roll : roll));
          car.position.y = Math.sin(s.dist * 1.7) * 0.012;
          // nose dips while braking
          const braking = ramp(tRoadIn, tRoadIn + 0.3, t) * (1 - ramp(tCarStop - 0.2, tCarStop + 0.4, t));
          const jerkRoad = t < tCarStop ? (h2(Math.floor(t * 3), 3) > 0.55 ? Math.sin(((t * 3) % 1) * Math.PI) : 0) : 0;
          car.rotation.x = -0.035 * braking + 0.03 * jerkRoad;
          car.position.z += 0.25 * jerkRoad;
          const stopped = t > tCarStop - 0.3;
          hazards.forEach((h) => (h.visible = stopped && Math.floor((t - tCarStop) * 1.6) % 2 === 0));
          roadRings.forEach((m) => (m.visible = false));
          const c = sample(roadKeys, t);
          car.updateMatrixWorld(true);
          camera.position.copy(car.localToWorld(new T.Vector3(c.p[0], c.p[1], c.p[2])));
          camera.lookAt(car.localToWorld(new T.Vector3(c.l[0], c.l[1], c.l[2])));
          camera.updateMatrixWorld();
          renderer.render(road, camera);
        }
      }

      // =========================================================
      // TIMELINE
      // =========================================================
      const tl = gsap.timeline({ paused: true });
      const state = { t: 0 };
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);

      function showLabel(id, a, b) {
        labelWin[id] = [a, b];
        tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, a);
        tl.fromTo("#" + id + " .txt", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, a);
        tl.to("#" + id, { opacity: 0, duration: 0.15, ease: "power2.in" }, b - 0.15);
      }
      showLabel("lbl-lima", M.lima, M.keilriemen - 0.05);
      showLabel("lbl-riemen", M.keilriemen, M.strom - 0.05);
      showLabel("lbl-strom", M.strom, LINES.l2.end + 0.2);
      showLabel("lbl-buersten", M.buersten, M.lager - 0.05);
      showLabel("lbl-lager", M.lager, LINES.l3.end + 0.25);
      showLabel("lbl-flackert", M.flackert, tRoadIn - 0.1);

      // the battery warning lamp lights on its word and stays on
      tl.fromTo("#lamp", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, M.lampe - 0.05);
      tl.to("#lamp", { opacity: 0, duration: 0.2 }, tRoadIn - 0.25);
      tl.set("#lamp", { visibility: "hidden" }, tRoadIn);

      // battery meter: hook + charging, and again while it fails
      [[0, LINES.l2.end + 0.3], [LINES.l4.start + 0.2, tRoadIn - 0.25]].forEach(([a, b], k) => {
        tl.fromTo("#meter", { opacity: k ? 0 : 1 }, { opacity: 1, duration: k ? 0.2 : 0.01, immediateRender: !k }, a);
        tl.to("#meter", { opacity: 0, duration: 0.2 }, b);
      });
      tl.set("#meter", { visibility: "hidden" }, tRoadIn);

      // follow hint early in the film, so more than the 2-3 % who reach the end see it
      const tHint = M.strom + 0.4;
      tl.fromTo("#follow-hint", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, tHint);
      tl.to("#fh-plus", { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, tHint + 0.5);
      tl.to("#follow-hint", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, tHint + 3.0);
      tl.set("#follow-hint", { visibility: "hidden" }, tHint + 3.3);

      // hook plate: on screen from frame 0
      tl.fromTo("#plate-hook", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#plate-hook .plate", { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.to("#plate-hook", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, M.lima - 0.2);

      // closing strip over a dimmed road
      tl.fromTo("#strip-dim", { opacity: 0 }, { opacity: 0.55, duration: 0.3 }, tOutroSpin - 0.15);
      tl.fromTo("#strip-wrap", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, tOutroSpin - 0.15);
      tl.fromTo("#strip-word", { scale: 0.7 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, tOutroStop);
      tl.to("#strip-ring", { scale: 1.18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, tOutroStop);

      // Werkstatt plate
      tl.fromTo("#plate-werkstatt", { opacity: 0 }, { opacity: 1, duration: 0.1 }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt .plate", { y: 50, clipPath: "inset(0 0 100% 0)" }, { y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power4.out" }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, M.werkstatt + 0.15);
      tl.to("#plate-werkstatt", { opacity: 0, duration: 0.2 }, tOutroSpin - 0.2);

      // follow card
      tl.fromTo("#follow", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tFollow);
      tl.set(["#strip-wrap", "#strip-dim"], { visibility: "hidden" }, tFollow + 0.21);
      tl.fromTo("#follow-pic", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, tFollow);
      tl.fromTo("#follow-text", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, tFollow + 0.15);
      tl.fromTo("#follow-hand", { x: 160, y: 200, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, tFollow + 0.3);
      tl.to("#follow-hand", { scale: 0.86, transformOrigin: "40% 0%", duration: 0.1, ease: "power2.in" }, tFollow + 0.85);
      tl.to("#follow-hand", { scale: 1, duration: 0.15, ease: "power2.out" }, tFollow + 0.95);
      tl.fromTo("#follow-plus", { scale: 1, backgroundColor: "#ffd24a" }, { scale: 1.25, backgroundColor: "#2a9d8f", duration: 0.12, ease: "power2.out" }, tFollow + 0.9);
      tl.to("#follow-plus", { scale: 1, duration: 0.2, ease: "back.out(2)" }, tFollow + 1.02);
      tl.set("#follow-plus", { textContent: "✓" }, tFollow + 0.95);

      render(0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
