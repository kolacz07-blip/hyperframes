<!doctype html>
<html
  lang="de"
  data-composition-variables='[{"id":"username","type":"string","label":"TikTok-Name","default":"@wasmachtdasteil"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/vendor/three.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #cc6b50;
      }
      #main {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #cc6b50;
      }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="28.7" data-width="1080" data-height="1920">
      <div id="ground"></div>
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="28.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="28.7"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <!-- AUDIO (data-start values are written by tools/build.mjs) -->
      <!--CUES-->
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="0.02" data-duration="1.50" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-klack-0" class="clip" src="assets/sfx/click.mp3" data-start="0.05" data-duration="0.30" data-track-index="14" data-volume="0.9"></audio>
      <audio id="sfx-klack-1" class="clip" src="assets/sfx/click.mp3" data-start="0.75" data-duration="0.30" data-track-index="15" data-volume="0.9"></audio>
      <audio id="sfx-klack-2" class="clip" src="assets/sfx/click.mp3" data-start="1.45" data-duration="0.30" data-track-index="14" data-volume="0.9"></audio>
      <audio id="sfx-klack-3" class="clip" src="assets/sfx/click.mp3" data-start="2.15" data-duration="0.30" data-track-index="15" data-volume="0.9"></audio>
      <audio id="sfx-t1" class="clip" src="assets/sfx/pop.mp3" data-start="9.09" data-duration="0.70" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-t2" class="clip" src="assets/sfx/pop.mp3" data-start="13.05" data-duration="0.70" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-t3" class="clip" src="assets/sfx/pop.mp3" data-start="17.65" data-duration="0.70" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-share" class="clip" src="assets/sfx/whoosh.mp3" data-start="21.55" data-duration="0.57" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-tap" class="clip" src="assets/sfx/click.mp3" data-start="25.47" data-duration="0.30" data-track-index="11" data-volume="0.8"></audio>
      <!--/CUES-->
      <audio id="voice" class="clip" src="assets/voice/voice.mp3" data-start="0.3" data-duration="25.16" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
