        <path d="M70 20 a18 18 0 0 1 36 0 v88 l14 -6 a17 17 0 0 1 22 9 l3 8 a17 17 0 0 1 21 10 l2 8 a16 16 0 0 1 20 12 v52 c0 28 -22 48 -50 48 h-30 c-24 0 -42 -14 -54 -36 l-30 -54 a16 16 0 0 1 26 -18 l20 26 z" fill="#ffffff" stroke="#1f1a24" stroke-width="8" stroke-linejoin="round" />

  <script>
    (function () {
      /*TIMING*/ const LINES = {"l1":{"start":0.3,"end":5.908},"l2":{"start":6.233,"end":10.644},"l3":{"start":11.248,"end":14.94},"l4":{"start":15.451,"end":18.969},"l5":{"start":19.352,"end":23.009},"l6":{"start":23.183,"end":25.285}}; const M = {"ruckelt":0.997,"zuendkerze":4.956,"zuendet":6.465,"gemisch":7.475,"tausend":9.112,"elektroden":12.409,"schwach":14.36,"ruckelt2":15.776,"schlecht":17.239,"sprit":18.458,"werkstatt":19.793,"kommentare":22.231,"naechstes":23.183,"batterie":24.449}; /*END TIMING*/
      const DUR = 28.5;
      const T = THREE;
      // ---------- helpers (deterministic)
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (a, b, t) => clamp01((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const E = {
        lin: (x) => x,
        io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
        io2: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
        in3: (x) => x * x * x,
        out3: (x) => 1 - Math.pow(1 - x, 3),
        out2: (x) => 1 - (1 - x) * (1 - x),
      };
      function h2(x, y) {
        let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        n ^= n >>> 16;
        return (n >>> 0) / 4294967296;
      }
      function vnoise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const flat = (color, extra) => new T.MeshLambertMaterial(Object.assign({ color, flatShading: true }, extra || {}));
      const col = (h) => new T.Color(h);

      // ---------- timing derived from the voice
      const tRoadIn = LINES.l5.start - 0.05; // cut to the road (iris)
      const tCarStop = tRoadIn + 2.6;
      const tOutroSpin = M.naechstes - 0.25; // the strip appears only at the end
      const tOutroStop = M.batterie + 0.05;
      const tFollow = Math.max(tOutroStop + 0.9, LINES.l6.end + 0.25);

      // ---------- renderer (portrait)
      const canvas = document.getElementById("world-canvas");
      const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      const camera = new T.PerspectiveCamera(50, 1080 / 1920, 0.03, 1400);

      // =========================================================
      // ROAD WORLD
      // =========================================================
      const road = new T.Scene();
      const FOG = "#f6b47a";
      road.fog = new T.Fog(FOG, 45, 420);
      road.add(new T.HemisphereLight("#ffe0b8", "#5a4636", 0.95));
      const sunLight = new T.DirectionalLight("#ffc890", 1.25);
      sunLight.position.set(60, 40, 120);
      road.add(sunLight);

      // sky dome, faceted
      {
        const g = new T.SphereGeometry(700, 18, 12).toNonIndexed();
        const pos = g.attributes.position;
        const colors = [];
        const top = col("#d9685a"), mid = col("#f08f5e"), hor = col(FOG);
        for (let i = 0; i < pos.count; i += 3) {
          const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 / 700;
          const c = y < 0.08 ? hor.clone() : y < 0.4 ? hor.clone().lerp(mid, (y - 0.08) / 0.32) : mid.clone().lerp(top, Math.min(1, (y - 0.4) / 0.5));
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        g.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        road.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false })));
        const sun = new T.Mesh(new T.CircleGeometry(34, 10), new T.MeshBasicMaterial({ color: "#ffe2a0", fog: false }));
        sun.position.set(150, 70, 560);
        sun.lookAt(0, 0, 0);
        road.add(sun);
      }

      function groundH(x, z) {
        const d = Math.abs(x);
        if (d < 6) return -0.02;
        const k = Math.min(1, (d - 6) / 14);
        return (d - 6) * 0.09 + k * (vnoise(x * 0.045, z * 0.045) * 9 + vnoise(x * 0.16, z * 0.16) * 1.6) - 0.02;
      }
      // terrain
      {
        const g = new T.PlaneGeometry(280, 560, 70, 140);
        g.rotateX(-Math.PI / 2);
        g.translate(0, 0, -80);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
        const ng = g.toNonIndexed();
        ng.computeVertexNormals();
        const q = ng.attributes.position;
        const greens = ["#6f9a52", "#5f8a49", "#82a85c", "#73a058"].map(col);
        const high = col("#b39a58"), peak = col("#c98552");
        const colors = [];
        for (let i = 0; i < q.count; i += 3) {
          const cx = (q.getX(i) + q.getX(i + 1) + q.getX(i + 2)) / 3;
          const cz = (q.getZ(i) + q.getZ(i + 1) + q.getZ(i + 2)) / 3;
          const cy = (q.getY(i) + q.getY(i + 1) + q.getY(i + 2)) / 3;
          let c = greens[Math.floor(h2(Math.round(cx * 3), Math.round(cz * 3)) * 4)].clone();
          if (cy > 5) c.lerp(high, Math.min(1, (cy - 5) / 5));
          if (cy > 10) c.lerp(peak, Math.min(1, (cy - 10) / 5));
          if (Math.abs(cx) < 4.6) c = col("#8a7a5c");
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        ng.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        road.add(new T.Mesh(ng, new T.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
      }
      // asphalt + markings
      {
        const asphalt = new T.Mesh(new T.PlaneGeometry(7.8, 560), flat("#4b4853"));
        asphalt.rotation.x = -Math.PI / 2;
        asphalt.position.set(0, 0.01, -80);
        road.add(asphalt);
        const lineMat = flat("#f1ede2");
        for (const x of [-3.6, 3.6]) {
          const m = new T.Mesh(new T.PlaneGeometry(0.14, 560), lineMat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(x, 0.02, -80);
          road.add(m);
        }
        const dashMat = flat("#f1ede2");
        const dashGeo = new T.PlaneGeometry(0.14, 3);
        for (let z = 190; z > -350; z -= 8) {
          const m = new T.Mesh(dashGeo, dashMat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(0, 0.02, z);
          road.add(m);
        }
      }
      // trees
      {
        const r = rng(7);
        const leafMats = ["#2f6b4f", "#3c7a52", "#4f8a4f"].map((c) => flat(c));
        const trunkMat = flat("#6b4430");
        const cone = new T.ConeGeometry(1, 1, 6);
        const trunkGeo = new T.CylinderGeometry(0.18, 0.24, 1, 5);
        for (let i = 0; i < 230; i++) {
          const side = r() < 0.5 ? -1 : 1;
          const x = side * (9 + Math.pow(r(), 1.4) * 80);
          const z = 180 - r() * 520;
          const s = 1.6 + r() * 2.4;
          const y = groundH(x, z);
          const tr = new T.Mesh(trunkGeo, trunkMat);
          tr.scale.set(1, s * 0.7, 1);
          tr.position.set(x, y + s * 0.35, z);
          road.add(tr);
          const lf = new T.Mesh(cone, leafMats[i % 3]);
          lf.scale.set(s * 0.75, s * 2.0, s * 0.75);
          lf.position.set(x, y + s * 0.7 + s, z);
          lf.rotation.y = r() * 3;
          road.add(lf);
        }
        // mountains on the horizon
        const mMats = ["#b0614c", "#c4775a", "#9a554b"].map((c) => flat(c));
        for (let i = 0; i < 26; i++) {
          const a = (i / 26) * Math.PI * 2 + r() * 0.2;
          const R = 330 + r() * 50;
          const H = 45 + r() * 60;
          const m = new T.Mesh(new T.ConeGeometry(55 + r() * 40, H, 6), mMats[i % 3]);
          m.position.set(Math.cos(a) * R, H / 2 - 6, -80 + Math.sin(a) * R);
          m.rotation.y = r() * 3;
          road.add(m);
        }
      }

      // car
      const car = new T.Group();
      road.add(car);
      const carBodyMat = flat("#2a9d8f");
      {
        const body = new T.Mesh(new T.BoxGeometry(1.9, 0.62, 4.3), carBodyMat);
        body.position.y = 0.66;
        car.add(body);
        const hood = new T.Mesh(new T.BoxGeometry(1.86, 0.12, 1.2), flat("#268f82"));
        hood.position.set(0, 1.0, -1.45);
        hood.rotation.x = -0.08;
        car.add(hood);
        // cabin: a side profile extruded across the car (shape x = -car z)
        function profileGeo(pts, width) {
          const s = new T.Shape();
          s.moveTo(-pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) s.lineTo(-pts[i][0], pts[i][1]);
          const g = new T.ExtrudeGeometry(s, { depth: width, bevelEnabled: false });
          g.translate(0, 0, -width / 2);
          g.rotateY(Math.PI / 2);
          return g;
        }
        const cabin = new T.Mesh(
          profileGeo([[-0.95, 0.96], [-0.22, 1.62], [1.0, 1.62], [1.6, 0.96]], 1.62),
          carBodyMat,
        );
        car.add(cabin);
        const glass = flat("#2f3f52");
        const sideGlass = new T.Mesh(
          profileGeo([[-0.74, 1.04], [-0.2, 1.52], [0.95, 1.52], [1.42, 1.04]], 1.66),
          glass,
        );
        car.add(sideGlass);
        const pillar = new T.Mesh(new T.BoxGeometry(1.68, 0.56, 0.12), carBodyMat);
        pillar.position.set(0, 1.28, 0.42);
        car.add(pillar);
        const ws = new T.Mesh(new T.BoxGeometry(1.42, 0.86, 0.04), glass);
        ws.rotation.x = 0.84;
        ws.position.set(0, 1.3, -0.62);
        car.add(ws);
        const lightMat = flat("#fff4d0");
        const tailMat = flat("#c0392b");
        for (const s of [-1, 1]) {
          const hl = new T.Mesh(new T.BoxGeometry(0.42, 0.16, 0.06), lightMat);
          hl.position.set(s * 0.62, 0.78, -2.16);
          car.add(hl);
          const tl = new T.Mesh(new T.BoxGeometry(0.42, 0.16, 0.06), tailMat);
          tl.position.set(s * 0.62, 0.8, 2.16);
          car.add(tl);
        }
      }
      const hazardMat = flat("#ff9b2f");
      const hazards = [];
      for (const [x, z] of [[-0.96, -1.9], [0.96, -1.9], [-0.96, 1.9], [0.96, 1.9]]) {
        const h = new T.Mesh(new T.BoxGeometry(0.08, 0.12, 0.3), hazardMat);
        h.position.set(x, 0.86, z);
        h.visible = false;
        car.add(h);
        hazards.push(h);
      }
      const wheels = [];
      function makeWheel() {
        const w = new T.Group();
        const tire = new T.Mesh(new T.CylinderGeometry(0.37, 0.37, 0.27, 12), flat("#2a2a2e"));
        tire.rotation.z = Math.PI / 2;
        w.add(tire);
        const rim = new T.Mesh(new T.CylinderGeometry(0.25, 0.25, 0.28, 10), flat("#cfd3da"));
        rim.rotation.z = Math.PI / 2;
        w.add(rim);
        for (let k = 0; k < 5; k++) {
          const sp = new T.Mesh(new T.BoxGeometry(0.02, 0.36, 0.07), flat("#8d939d"));
          const g = new T.Group();
          sp.position.y = 0.0;
          g.add(sp);
          g.rotation.x = (k / 5) * Math.PI;
          g.position.x = -0.142;
          w.add(g);
        }
        const cap = new T.Mesh(new T.CylinderGeometry(0.085, 0.085, 0.3, 8), flat("#44444c"));
        cap.rotation.z = Math.PI / 2;
        w.add(cap);
        return w;
      }
      const FL = [-0.86, 0.37, -1.35];
      for (const [x, z] of [[-0.86, -1.35], [0.86, -1.35], [-0.86, 1.4], [0.86, 1.4]]) {
        const w = makeWheel();
        w.position.set(x, 0.37, z);
        if (x > 0) w.rotation.y = Math.PI;
        car.add(w);
        wheels.push(w);
      }
      // hum rings around the front wheel (road)
      const ringMat = (o) => new T.MeshBasicMaterial({ color: "#ffd24a", transparent: true, opacity: o, fog: false, depthWrite: false });
      const roadRings = [];
      for (let k = 0; k < 3; k++) {
        const m = new T.Mesh(new T.TorusGeometry(1, 0.025, 3, 36), ringMat(0));
        m.rotation.y = Math.PI / 2;
        m.position.set(FL[0] - 0.2, FL[1], FL[2]);
        car.add(m);
        roadRings.push(m);
      }

      const V = 13; // m/s
      function carState(t) {
        if (t < tRoadIn) return { x: 1.8, z: -V * t, dist: V * t };
        const dt = t - tRoadIn;
        const Tst = tCarStop - tRoadIn;
        const z0 = -118;
        const k = Math.min(dt, Tst);
        const d = V * k - (V / (2 * Tst)) * k * k;
        const shift = E.io2(ramp(tRoadIn + 0.6, tCarStop, t));
        return { x: 1.8 + shift * 1.5, z: z0 - d, dist: 2000 + d, yaw: Math.sin(Math.PI * shift) * 0.06 };
      }


      // =========================================================
      // PLUG WORLD (cut-open cylinder, plug from the top, axis = Y)
      // =========================================================
      const brk = new T.Scene();
      {
        const g = new T.IcosahedronGeometry(70, 2);
        const pos = g.attributes.position;
        const colors = [];
        const top = col("#ea9662"), mid = col("#cc6b50"), bot = col("#7a3a48");
        for (let i = 0; i < pos.count; i += 3) {
          const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 / 70;
          const j = (h2(i, 3) - 0.5) * 0.06;
          const c = y > 0 ? mid.clone().lerp(top, Math.min(1, y * 1.4 + j)) : mid.clone().lerp(bot, Math.min(1, -y * 1.3 + j));
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        g.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        brk.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
      }
      brk.add(new T.HemisphereLight("#ffe6cc", "#6b3a3a", 0.85));
      const bKey = new T.DirectionalLight("#fff1dd", 1.15);
      bKey.position.set(8, 10, 9);
      brk.add(bKey);
      const bRim = new T.DirectionalLight("#b9d3ff", 0.6);
      bRim.position.set(-9, 3, -8);
      brk.add(bRim);
      renderer.localClippingEnabled = true;

      const addTo = (p, geo, mat, pos, rot) => {
        const m = new T.Mesh(geo, mat);
        if (pos) m.position.set(pos[0], pos[1], pos[2]);
        if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
        p.add(m);
        return m;
      };
      // the engine block is always cut open at the front (keeps z <= 0)
      const cutPlane = new T.Plane(new T.Vector3(0, 0, -1), 0);
      const matBlock = flat("#5f6370", { clippingPlanes: [cutPlane], side: T.DoubleSide });
      const matHead = flat("#767b88", { clippingPlanes: [cutPlane], side: T.DoubleSide });
      const matPiston = flat("#a7acb6");
      const matRod = flat("#7d828c");
      const matCeramic = flat("#f1ede2");
      const matHex = flat("#c3c8d1");
      const matThread = flat("#9aa0aa");
      const matTerm = flat("#d6d9e0");
      const matElec = flat("#e3e6eb");
      const C = { elec: col("#e3e6eb"), soot: col("#2b2522"), ceramic: col("#f1ede2"), tipSoot: col("#4a3f38") };

      const CH_TOP = 1.9; // roof of the combustion chamber
      addTo(brk, new T.CylinderGeometry(2.2, 2.2, 5.6, 20, 1, true), matBlock, [0, -1.0, 0]);
      addTo(brk, new T.CylinderGeometry(3.2, 3.2, 5.6, 8, 1, true), matBlock, [0, -1.0, 0]);
      addTo(brk, new T.BoxGeometry(6.6, 1.6, 4.4), matHead, [0, CH_TOP + 0.8, 0]);
      // a little valve pair in the roof so the chamber reads as an engine
      for (const x of [-1.2, 1.2]) {
        addTo(brk, new T.CylinderGeometry(0.55, 0.55, 0.12, 12), matRod, [x, CH_TOP - 0.05, -0.6]);
        addTo(brk, new T.CylinderGeometry(0.1, 0.1, 1.6, 6), matRod, [x, CH_TOP + 0.8, -0.6]);
      }
      // the fuel-air mixture: a faint haze, coloured once lit
      const matMix = new T.MeshBasicMaterial({ color: "#f2d6a2", transparent: true, opacity: 0.0, depthWrite: false });
      const mix = addTo(brk, new T.CylinderGeometry(2.05, 2.05, 1, 20), matMix);

      const piston = new T.Group();
      brk.add(piston);
      addTo(piston, new T.CylinderGeometry(2.08, 2.08, 1.3, 20), matPiston);
      for (const y of [0.35, 0.1]) addTo(piston, new T.TorusGeometry(2.08, 0.04, 3, 32), matRod, [0, y, 0], [Math.PI / 2, 0, 0]);
      const conrod = addTo(brk, new T.BoxGeometry(0.55, 3.2, 0.45), matRod);

      // the spark plug, tip just below the chamber roof
      const plug = new T.Group();
      brk.add(plug);
      const TIP = CH_TOP - 0.12;
      addTo(plug, new T.CylinderGeometry(0.34, 0.34, 1.0, 10), matThread, [0, TIP + 0.62, 0]);
      for (let k = 0; k < 7; k++) addTo(plug, new T.TorusGeometry(0.36, 0.035, 3, 14), matThread, [0, TIP + 0.22 + k * 0.13, 0], [Math.PI / 2, 0, 0]);
      addTo(plug, new T.CylinderGeometry(0.62, 0.62, 0.5, 6), matHex, [0, TIP + 1.45, 0]);
      addTo(plug, new T.CylinderGeometry(0.3, 0.42, 2.2, 10), matCeramic, [0, TIP + 2.8, 0]);
      for (let k = 0; k < 4; k++) addTo(plug, new T.TorusGeometry(0.33, 0.05, 4, 14), matCeramic, [0, TIP + 2.4 + k * 0.35, 0], [Math.PI / 2, 0, 0]);
      addTo(plug, new T.CylinderGeometry(0.16, 0.16, 0.6, 8), matTerm, [0, TIP + 4.15, 0]);
      const insTip = addTo(plug, new T.CylinderGeometry(0.1, 0.2, 0.3, 8), matCeramic, [0, TIP + 0.05, 0]);
      const centre = addTo(plug, new T.CylinderGeometry(0.055, 0.055, 0.32, 6), matElec);
      const ground = new T.Group();
      plug.add(ground);
      addTo(ground, new T.BoxGeometry(0.1, 0.42, 0.14), matElec, [0.3, 0.21, 0]);
      addTo(ground, new T.BoxGeometry(0.4, 0.1, 0.14), matElec, [0.12, 0, 0]);

      // spark: a jagged bolt of small boxes between the electrodes
      const boltMat = new T.MeshBasicMaterial({ color: "#fff6c4" });
      const bolt = [];
      for (let k = 0; k < 6; k++) {
        const m = new T.Mesh(new T.BoxGeometry(0.05, 1, 0.05), boltMat);
        brk.add(m);
        bolt.push(m);
      }
      // flame burst after each good spark
      const flameMats = ["#ffcf4a", "#ff8a3d", "#e8572f"].map((c) => new T.MeshBasicMaterial({ color: c, transparent: true, opacity: 0, depthWrite: false }));
      const flames = flameMats.map((m, k) => addTo(brk, new T.IcosahedronGeometry(1, 0), m));
      const r3 = rng(31);
      const soot = [];
      for (let k = 0; k < 14; k++) {
        const m = new T.Mesh(new T.TetrahedronGeometry(0.05), new T.MeshBasicMaterial({ color: "#2b2522" }));
        soot.push({ m, a: r3() * Math.PI * 2, d: r3(), v: 0.4 + r3() * 0.6 });
        brk.add(m);
      }

      // engine phase: one revolution per firing (simplified), speed in rev/s
      const HZ = 120;
      const phaseTable = new Float32Array(Math.ceil((DUR + 1) * HZ) + 2);
      function revs(t) {
        let r = 1.6; // hook: slow, stuttering
        if (t > M.zuendet - 0.2) r = 2.2;
        if (t > M.tausend - 0.1) r = 6.5; // "über tausend Mal pro Minute"
        if (t > LINES.l3.start) r = 1.4; // slow again for the close-up
        if (t > LINES.l4.start) r = 2.0;
        return r;
      }
      phaseTable[0] = 0.1; // frame 0 lands inside the first flame
      for (let i = 1; i < phaseTable.length; i++) phaseTable[i] = phaseTable[i - 1] + revs(i / HZ) / HZ;
      const phaseAt = (t) => {
        const f = Math.max(0, Math.min(phaseTable.length - 2, t * HZ));
        const i = Math.floor(f);
        return lerp(phaseTable[i], phaseTable[i + 1], f - i);
      };
      // does cycle n fire? misfires in the hook and in the symptoms line
      function fires(n, t) {
        if (n === 0) return true;
        const inHook = t < LINES.l1.end + 0.2;
        const inSymptoms = t > LINES.l4.start && t < LINES.l4.end + 0.4;
        if (inHook || inSymptoms) return h2(n, 7) > 0.45;
        return true;
      }

      // =========================================================
      // CAMERA PATHS
      // =========================================================
      const brkKeys = [
        { t: 0, p: [3.4, 2.0, 13.5], l: [0, 0.6, 0] }, // frame 0: the whole cut-open cylinder, mid-explosion
        { t: M.zuendkerze - 0.15, p: [3.0, 2.2, 11.0], l: [0, 1.0, 0], e: "lin" },
        { t: M.zuendkerze + 0.6, p: [3.6, 3.4, 9.0], l: [0, 2.9, 0], e: "out3" },
        { t: M.gemisch - 0.1, p: [4.6, 1.2, 12.5], l: [0, 0.2, 0], e: "io" },
        { t: LINES.l2.end, p: [4.2, 1.0, 12.0], l: [0, 0.2, 0], e: "lin" },
        { t: LINES.l3.start + 0.5, p: [1.7, 1.6, 4.0], l: [0, 1.5, 0], e: "io" },
        { t: LINES.l3.end, p: [1.5, 1.55, 3.7], l: [0, 1.5, 0], e: "lin" },
        { t: LINES.l4.start + 0.5, p: [-4.4, 1.6, 12.5], l: [0, 0.6, 0], e: "io" },
        { t: tRoadIn, p: [-4.8, 1.8, 13.0], l: [0, 0.6, 0], e: "lin" },
      ];
      const roadKeys = [
        { t: tRoadIn, p: [-3.2, 1.0, -7.5], l: [0, 0.7, -0.5] },
        { t: tCarStop, p: [-6.5, 2.4, -10.5], l: [0, 0.9, -0.3], e: "out3" },
        { t: DUR, p: [-7.2, 2.8, -11.4], l: [0, 1.0, -0.3], e: "lin" },
      ];
      function sample(keys, t) {
        if (t <= keys[0].t) return keys[0];
        for (let i = 1; i < keys.length; i++) {
          const b = keys[i];
          if (t <= b.t) {
            const a = keys[i - 1];
            const k = E[b.e || "io"](clamp01((t - a.t) / Math.max(1e-3, b.t - a.t)));
            return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l.map((v, j) => lerp(v, b.l[j], k)) };
          }
        }
        return keys[keys.length - 1];
      }

      // =========================================================
      // LABELS + STRIP (HTML)
      // =========================================================
      const v3 = new T.Vector3();
      const labelWin = {};
      let nowT = 0;
      function place(id, world) {
        const el = document.getElementById(id);
        const w = labelWin[id];
        const on = w && nowT >= w[0] - 0.02 && nowT <= w[1] + 0.02;
        el.style.visibility = on ? "visible" : "hidden";
        if (!on) return;
        v3.copy(world).project(camera);
        const x = Math.max(200, Math.min(880, (v3.x * 0.5 + 0.5) * 1080));
        const y = (-v3.y * 0.5 + 0.5) * 1920;
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      }

      const SLOT = 200; // px between icon centres
      const N = 8;
      const slots = Array.from({ length: N }, (_, i) => document.getElementById("slot-" + i));
      const shards = Array.from(document.querySelectorAll("#strip-wrap .shard"));
      const shardDir = shards.map((_, i) => {
        const a = (i / shards.length) * Math.PI * 2 + 0.3;
        return [Math.cos(a), Math.sin(a) * 0.8 - 0.35, 0.7 + h2(i, 9) * 0.6];
      });
      // slot-machine ease: very fast at p=0, slight overshoot, settle
      const reel = (p) => {
        const c1 = 0.9, c3 = c1 + 1;
        const q = p - 1;
        return 1 + c3 * q * q * q + c1 * q * q;
      };
      function stripOffset(t, target, t0, t1, loops) {
        const p = clamp01((t - t0) / (t1 - t0));
        return target * SLOT - (1 - reel(p)) * loops * N * SLOT;
      }
      function drawStrip(off, burstT) {
        const W = N * SLOT;
        slots.forEach((el, i) => {
          let x = i * SLOT - off;
          x = ((((x + W / 2) % W) + W) % W) - W / 2;
          el.style.transform = `translateX(${(540 + x).toFixed(1)}px)`;
        });
        shards.forEach((el, i) => {
          const k = clamp01(burstT / 0.7);
          const on = burstT > 0 && k < 1;
          el.style.opacity = on ? (1 - k).toFixed(3) : "0";
          if (!on) return;
          const d = shardDir[i];
          const dist = E.out3(k) * 330 * d[2];
          el.style.transform = `translate(${(d[0] * dist).toFixed(1)}px, ${(d[1] * dist + k * k * 140).toFixed(1)}px) rotate(${(k * 540 + i * 40).toFixed(0)}deg)`;
        });
      }

      // =========================================================
      // RENDER
      // =========================================================
      const iris = document.getElementById("world-iris");
      const kicker = document.getElementById("strip-kicker");
      const word = document.getElementById("strip-word");

      function render(t) {
        nowT = t;
        // iris for the cut to the road
        iris.style.opacity = (ramp(tRoadIn - 0.22, tRoadIn, t) * (1 - ramp(tRoadIn, tRoadIn + 0.35, t))).toFixed(3);

        // strip: opening (today) and closing (next)
        drawStrip(stripOffset(t, 4, tOutroSpin, tOutroStop, 2), t - tOutroStop);
        word.textContent = t >= tOutroStop - 0.02 ? "Batterie" : "…";

        const inRoad = t >= tRoadIn;
        let shake = 0;
        if (!inRoad) {
          const ph = phaseAt(t);
          const n = Math.floor(ph);
          const frac = ph - n;
          const th = frac * Math.PI * 2; // 0 = top dead centre
          const pistonY = -1.2 + 1.2 * Math.cos(th);
          piston.position.set(0, pistonY, 0);
          const pinY = pistonY - 0.2;
          const crankX = 0.9 * Math.sin(th), crankY = -4.3 + 0.9 * Math.cos(th);
          conrod.position.set(crankX / 2, (pinY + crankY) / 2, 0);
          conrod.scale.set(1, Math.hypot(crankX, pinY - crankY) / 3.2, 1);
          conrod.rotation.z = Math.atan2(crankX, pinY - crankY);

          // electrode wear and soot
          const wear = E.io2(ramp(M.elektroden - 0.2, M.schwach + 0.3, t));
          const cLen = lerp(0.32, 0.14, wear);
          centre.scale.set(1, cLen / 0.32, 1);
          centre.position.set(0, TIP - 0.1 - cLen / 2, 0);
          const cTip = TIP - 0.1 - cLen;
          const gap = lerp(0.13, 0.32, wear);
          ground.position.set(0, cTip - gap, 0);
          matElec.color.copy(C.elec).lerp(C.soot, wear * 0.8);
          insTip.material = matCeramic;
          matCeramic.color.copy(C.ceramic);

          // spark strength over the film
          let strength = 0.45;
          if (t > M.zuendet - 0.2) strength = 1;
          if (t > LINES.l3.start) strength = lerp(1, 0.32, E.io2(ramp(M.elektroden, M.schwach + 0.2, t)));
          if (t > LINES.l4.start) strength = 0.4;
          const good = fires(n, t);
          const sparkOn = good && frac < 0.09;
          const gy0 = cTip, gy1 = cTip - gap;
          bolt.forEach((m, k) => {
            m.visible = sparkOn;
            if (!sparkOn) return;
            const a = gy0 - (k / bolt.length) * gap;
            const b = gy0 - ((k + 1) / bolt.length) * gap;
            const jx = (h2(n * 13 + k, 3) - 0.5) * 0.12 * strength;
            const jz = (h2(n * 17 + k, 5) - 0.5) * 0.08;
            m.position.set(jx, (a + b) / 2, jz);
            m.scale.set(0.6 + strength * 1.4, (a - b) * 1.25, 0.6 + strength * 1.4);
            m.rotation.z = (h2(n * 7 + k, 11) - 0.5) * 0.9;
          });
          // flame after a good, strong enough spark
          const closeUp = t > LINES.l3.start && t < LINES.l4.start + 0.3; // electrode close-up: no flame filling the lens
          const burnOk = closeUp ? false : t < LINES.l1.end + 0.2 ? true : strength > 0.6;
          const burn = good && burnOk ? clamp01((frac - 0.02) / 0.32) : 0;
          flames.forEach((f, k) => {
            const on = burn > 0 && burn < 1;
            f.visible = on;
            if (!on) return;
            const sc = (0.4 + E.out3(burn) * (2.0 - k * 0.3)) * (0.6 + strength * 0.4);
            f.scale.set(sc * 1.15, sc * 0.55, sc * 1.15);
            f.position.set(0, (CH_TOP + pistonY + 0.65) / 2 + 0.25, 0);
            f.rotation.set(n * 0.7 + k, n * 1.3, 0);
            f.material.opacity = Math.min(1, (1 - burn) * 1.4) * (0.95 - k * 0.12);
          });
          // mixture haze in the chamber before ignition (only while it is explained)
          const mixK = ramp(M.gemisch - 0.3, M.gemisch, t) * (1 - ramp(LINES.l2.end, LINES.l2.end + 0.4, t));
          const chamberH = Math.max(0.05, CH_TOP - (pistonY + 0.65));
          mix.scale.set(1, chamberH, 1);
          mix.position.set(0, pistonY + 0.65 + chamberH / 2, 0);
          matMix.opacity = mixK * (frac > 0.6 || frac < 0.03 ? 0.45 : 0.12);
          mix.visible = mixK > 0.01;
          // soot flakes around the tip while it wears
          const sootK = ramp(M.elektroden, M.elektroden + 0.4, t) * (1 - ramp(LINES.l3.end + 0.3, LINES.l3.end + 0.8, t));
          soot.forEach((s) => {
            s.m.visible = sootK > 0.02;
            const q = (((t * 0.4 * s.v + s.d) % 1) + 1) % 1;
            s.m.position.set(Math.cos(s.a + t * s.v) * (0.25 + q * 0.35), TIP - 0.2 - q * 0.6, Math.sin(s.a + t * s.v) * (0.25 + q * 0.35));
          });

          // a misfire jerks the picture ("ruckelt")
          const jerk = !good && frac < 0.25 ? Math.sin(frac * Math.PI * 4) : 0;
          shake = jerk * (t < LINES.l1.end + 0.2 ? 0.05 : 0.12);
          const cam = sample(brkKeys, t);
          const sx = Math.sin(t * 61) * shake, sy = jerk * shake * 1.6;
          camera.position.set(cam.p[0] + sx, cam.p[1] + sy, cam.p[2]);
          camera.lookAt(cam.l[0] + sx * 0.5, cam.l[1] + sy, cam.l[2]);
          camera.updateMatrixWorld();
          brk.updateMatrixWorld(true);
          renderer.render(brk, camera);

          place("lbl-kerze", new T.Vector3(0.42, TIP + 2.9, 0));
          place("lbl-funke", new T.Vector3(0.05, cTip - gap / 2, 0.1));
          place("lbl-gemisch", new T.Vector3(-1.1, (CH_TOP + pistonY + 0.65) / 2, 0));
          place("lbl-elektroden", new T.Vector3(0.1, cTip - 0.05, 0.1));
          place("lbl-schwach", new T.Vector3(0.05, cTip - gap / 2, 0.1));
          place("lbl-ruckelt", new T.Vector3(1.6, pistonY + 0.65, 0));
          place("lbl-start", new T.Vector3(0.4, TIP + 3.6, 0));
          place("lbl-sprit", new T.Vector3(-1.4, 0.2, 0));
        } else {
          document.querySelectorAll("#root .lbl").forEach((el) => (el.style.visibility = "hidden"));
          const s = carState(t);
          car.position.set(s.x, 0, s.z);
          car.rotation.y = s.yaw || 0;
          const roll = -s.dist / 0.37;
          wheels.forEach((w) => (w.rotation.x = w.rotation.y ? -roll : roll));
          car.position.y = Math.sin(s.dist * 1.7) * 0.012;
          // nose dips while braking
          const braking = ramp(tRoadIn, tRoadIn + 0.3, t) * (1 - ramp(tCarStop - 0.2, tCarStop + 0.4, t));
          const jerkRoad = t < tCarStop ? (h2(Math.floor(t * 3), 3) > 0.55 ? Math.sin(((t * 3) % 1) * Math.PI) : 0) : 0;
          car.rotation.x = -0.035 * braking + 0.03 * jerkRoad;
          car.position.z += 0.25 * jerkRoad;
          const stopped = t > tCarStop - 0.3;
          hazards.forEach((h) => (h.visible = stopped && Math.floor((t - tCarStop) * 1.6) % 2 === 0));
          roadRings.forEach((m) => (m.visible = false));
          const c = sample(roadKeys, t);
          car.updateMatrixWorld(true);
          camera.position.copy(car.localToWorld(new T.Vector3(c.p[0], c.p[1], c.p[2])));
          camera.lookAt(car.localToWorld(new T.Vector3(c.l[0], c.l[1], c.l[2])));
          camera.updateMatrixWorld();
          renderer.render(road, camera);
        }
      }

      // =========================================================
      // TIMELINE
      // =========================================================
      const tl = gsap.timeline({ paused: true });
      const state = { t: 0 };
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);

      function showLabel(id, a, b) {
        labelWin[id] = [a, b];
        tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, a);
        tl.fromTo("#" + id + " .txt", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, a);
        tl.to("#" + id, { opacity: 0, duration: 0.15, ease: "power2.in" }, b - 0.15);
      }
      showLabel("lbl-kerze", M.zuendkerze, M.zuendet - 0.05);
      showLabel("lbl-funke", M.zuendet, M.gemisch - 0.05);
      showLabel("lbl-gemisch", M.gemisch, LINES.l2.end + 0.2);
      showLabel("lbl-elektroden", M.elektroden, M.schwach - 0.05);
      showLabel("lbl-schwach", M.schwach, LINES.l3.end + 0.3);
      showLabel("lbl-ruckelt", M.ruckelt2, LINES.l4.end + 0.2);
      showLabel("lbl-start", M.schlecht, LINES.l4.end + 0.2);
      showLabel("lbl-sprit", M.sprit, LINES.l4.end + 0.2);

      // hook plate: on screen from frame 0
      tl.fromTo("#plate-hook", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#plate-hook .plate", { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.to("#plate-hook", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, M.zuendkerze - 0.2);

      // closing strip over a dimmed road
      tl.fromTo("#strip-dim", { opacity: 0 }, { opacity: 0.55, duration: 0.3 }, tOutroSpin - 0.15);
      tl.fromTo("#strip-wrap", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, tOutroSpin - 0.15);
      tl.fromTo("#strip-word", { scale: 0.7 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, tOutroStop);
      tl.to("#strip-ring", { scale: 1.18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, tOutroStop);

      // Werkstatt plate
      tl.fromTo("#plate-werkstatt", { opacity: 0 }, { opacity: 1, duration: 0.1 }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt .plate", { y: 50, clipPath: "inset(0 0 100% 0)" }, { y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power4.out" }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, M.werkstatt + 0.15);
      tl.to("#plate-werkstatt", { opacity: 0, duration: 0.2 }, tOutroSpin - 0.2);

      // follow card
      tl.fromTo("#follow", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tFollow);
      tl.set(["#strip-wrap", "#strip-dim"], { visibility: "hidden" }, tFollow + 0.21);
      tl.fromTo("#follow-pic", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, tFollow);
      tl.fromTo("#follow-text", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, tFollow + 0.15);
      tl.fromTo("#follow-hand", { x: 160, y: 200, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, tFollow + 0.3);
      tl.to("#follow-hand", { scale: 0.86, transformOrigin: "40% 0%", duration: 0.1, ease: "power2.in" }, tFollow + 0.85);
      tl.to("#follow-hand", { scale: 1, duration: 0.15, ease: "power2.out" }, tFollow + 0.95);
      tl.fromTo("#follow-plus", { scale: 1, backgroundColor: "#ffd24a" }, { scale: 1.25, backgroundColor: "#2a9d8f", duration: 0.12, ease: "power2.out" }, tFollow + 0.9);
      tl.to("#follow-plus", { scale: 1, duration: 0.2, ease: "back.out(2)" }, tFollow + 1.02);
      tl.set("#follow-plus", { textContent: "✓" }, tFollow + 0.95);

      render(0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
