    <script>
      (function () {
        /*TIMING*/ const DUR = 25.2;
        const LINES = {
          l1: { start: 0.3, end: 2.553 },
          l2: { start: 2.878, end: 6.626 },
          l3: { start: 6.951, end: 12.933 },
          l4: { start: 13.307, end: 17.991 },
          l5: { start: 18.364, end: 21.946 },
        };
        const M = {
          das: 0.684,
          werkstatt: 1.943,
          eins: 3.173,
          belaege: 5.79,
          zwei: 7.197,
          oel: 10.08,
          motorschaden: 12.186,
          drei: 13.573,
          tempo: 15.137,
          radlager: 17.026,
          geraeusch: 18.698,
          kommentare: 20.243,
          folg: 20.942,
        };
        const WORDS = [
          ["Hörst", 0.3, 0.565],
          ["du", 0.586, 0.635],
          ["das?", 0.684, 1.019],
          ["Dann", 1.254, 1.431],
          ["sofort", 1.471, 1.747],
          ["in", 1.786, 1.825],
          ["die", 1.854, 1.914],
          ["Werkstatt.", 1.943, 2.553],
          ["Nummer", 2.878, 3.114],
          ["eins:", 3.173, 3.616],
          ["Kreischen", 3.764, 4.118],
          ["beim", 4.157, 4.275],
          ["Bremsen.", 4.314, 4.875],
          ["Dann", 5.308, 5.505],
          ["sind", 5.544, 5.672],
          ["die", 5.692, 5.761],
          ["Beläge", 5.79, 6.086],
          ["runter.", 6.125, 6.626],
          ["Nummer", 6.951, 7.148],
          ["zwei:", 7.197, 7.669],
          ["Klackern", 7.847, 8.161],
          ["aus", 8.201, 8.289],
          ["dem", 8.329, 8.417],
          ["Motor.", 8.436, 8.978],
          ["Oft", 9.49, 9.725],
          ["fehlt", 9.775, 10.011],
          ["Öl", 10.08, 10.336],
          ["prüf", 10.651, 10.897],
          ["es", 10.946, 10.995],
          ["sofort,", 11.014, 11.467],
          ["sonst", 11.546, 11.782],
          ["droht", 11.802, 12.018],
          ["ein", 12.068, 12.136],
          ["Motorschaden.", 12.186, 12.933],
          ["Nummer", 13.307, 13.543],
          ["drei:", 13.573, 14.036],
          ["ein", 14.163, 14.301],
          ["Brummen,", 14.35, 14.694],
          ["das", 14.714, 14.822],
          ["mit", 14.871, 14.96],
          ["dem", 14.98, 15.078],
          ["Tempo", 15.137, 15.393],
          ["lauter", 15.452, 15.688],
          ["wird.", 15.727, 16.042],
          ["Meist", 16.416, 16.692],
          ["ist", 16.741, 16.849],
          ["das", 16.869, 16.958],
          ["Radlager", 17.026, 17.459],
          ["kaputt.", 17.498, 17.991],
          ["Welches", 18.364, 18.659],
          ["Geräusch", 18.698, 19.003],
          ["kennst", 19.053, 19.279],
          ["du?", 19.299, 19.555],
          ["Schreib's", 19.761, 20.047],
          ["in", 20.076, 20.125],
          ["die", 20.155, 20.214],
          ["Kommentare", 20.243, 20.755],
          ["und", 20.804, 20.883],
          ["folg", 20.942, 21.119],
          ["mir", 21.158, 21.237],
          ["für", 21.257, 21.375],
          ["mehr!", 21.404, 21.946],
        ]; /*END TIMING*/
        const tl = gsap.timeline({ paused: true });
        const clamp01 = (x) => Math.max(0, Math.min(1, x));
        const ramp = (a, b, t) => clamp01((t - a) / (b - a));
        function h2(x, y) {
          let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
          n = Math.imul(n ^ (n >>> 13), 1274126177);
          n ^= n >>> 16;
          return (n >>> 0) / 4294967296;
        }
        // which noise is playing (mirrors the cues in tools/build.mjs)
        const SND = [
          ["kreischen", -0.2, 2.2, 1.0],
          ["kreischen", M.eins - 0.1, M.eins + 2.5, 0.6],
          ["klackern", M.zwei - 0.1, M.zwei + 2.7, 0.7],
          ["brummen", M.drei - 0.1, M.drei + 3.3, 0.75],
        ];
        // radial sound bars around the disc
        const bars = document.getElementById("bars");
        const NB = 44;
        const barEls = Array.from({ length: NB }, (_, i) => {
          const b = document.createElement("div");
          b.className = "bar";
          bars.appendChild(b);
          return b;
        });
        function drawBars(t) {
          let kind = null,
            gain = 0,
            u = 0;
          for (const [k, a, b, g] of SND)
            if (t >= a && t < b) {
              kind = k;
              gain = g * Math.min(1, (t - a) / 0.08, (b - t) / 0.3);
              u = t - a;
            }
          barEls.forEach((el, i) => {
            const ang = (i / NB) * 360;
            let amp = 0.08 + 0.04 * Math.sin(t * 2 + i);
            if (kind === "kreischen") amp = 0.35 + 0.65 * h2(i, Math.floor(t * 30));
            if (kind === "klackern")
              amp =
                0.15 +
                0.85 * Math.exp(-((u % 0.11) * 30)) * (0.6 + 0.4 * h2(i, Math.floor(u / 0.11)));
            if (kind === "brummen")
              amp =
                (0.25 + 0.75 * Math.min(1, 0.3 + u / 2.5)) *
                (0.55 + 0.45 * Math.sin(u * 14 + i * 0.6));
            const len = 30 + 150 * amp * (kind ? gain : 1);
            el.style.transform = `rotate(${ang.toFixed(1)}deg) translateY(232px) scaleY(${(len / 100).toFixed(3)})`;
            el.style.background = kind === "kreischen" && amp > 0.8 ? "#ff7b6b" : "#ffd24a";
          });
          // the disc shakes with the noise
          const sh = kind ? gain * (kind === "brummen" ? 4 : 7) : 0;
          document.getElementById("disc").style.transform =
            `translate(${(Math.sin(t * 71) * sh).toFixed(1)}px, ${(Math.sin(t * 53) * sh).toFixed(1)}px)`;
          document.getElementById("flash").style.opacity = (
            t < 2.2 ? 0.22 * h2(1, Math.floor(t * 12)) * (1 - t / 2.2) : 0
          ).toFixed(3);
        }
        const st = { t: 0 };
        tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => drawBars(st.t) }, 0);
        drawBars(0);

        // hook: on screen from frame 0
        tl.fromTo("#face-0", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
        tl.fromTo(
          "#hook .plate",
          { scale: 1.15 },
          { scale: 1, duration: 0.3, ease: "back.out(2.5)" },
          0,
        );
        tl.to("#hook", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, M.eins - 0.35);
        tl.set("#hook", { visibility: "hidden" }, M.eins - 0.1);
        tl.to("#face-0", { opacity: 0, duration: 0.15 }, M.eins - 0.3);
        tl.fromTo(
          "#progress",
          { opacity: 0, y: -30 },
          { opacity: 1, y: 0, duration: 0.25 },
          M.eins - 0.2,
        );

        // the three noises
        const items = [
          [1, M.eins, M.belaege],
          [2, M.zwei, M.oel],
          [3, M.drei, M.radlager],
        ];
        items.forEach(([n, t0, tc], k) => {
          const t1 = k < 2 ? items[k + 1][1] - 0.3 : M.geraeusch - 0.3;
          tl.fromTo(
            "#face-" + n,
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" },
            t0 - 0.25,
          );
          tl.to("#face-" + n, { opacity: 0, duration: 0.15 }, t1);
          tl.set("#num", { textContent: String(n) }, t0 - 0.3);
          tl.fromTo(
            "#num",
            { opacity: 0, scale: 0.3, rotation: -30 },
            { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" },
            t0 - 0.3,
          );
          tl.to("#num", { opacity: 0, duration: 0.12 }, t1);
          tl.fromTo(
            "#t-" + n,
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" },
            t0,
          );
          tl.to("#t-" + n, { opacity: 0, duration: 0.12 }, t1);
          tl.fromTo(
            "#c-" + n,
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" },
            tc - 0.05,
          );
          tl.to("#c-" + n, { opacity: 0, duration: 0.12 }, t1);
          tl.fromTo(
            "#dot-" + n,
            { backgroundColor: "#2c2531", color: "#8a7f90", borderColor: "#4a4050", scale: 1 },
            {
              backgroundColor: "#ffd24a",
              color: "#1f1a24",
              borderColor: "#1f1a24",
              scale: 1.15,
              duration: 0.25,
              ease: "back.out(2)",
            },
            t0 - 0.3,
          );
          tl.to("#dot-" + n, { scale: 1, duration: 0.2 }, t0 + 0.2);
        });
        // ending: which one do you know -> comments -> follow
        const tE = M.geraeusch - 0.15;
        tl.to("#progress", { opacity: 0, duration: 0.2 }, tE);
        tl.fromTo(
          "#face-4",
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" },
          tE,
        );
        tl.fromTo("#t-4", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25 }, tE + 0.05);
        tl.fromTo(
          "#c-4",
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" },
          M.kommentare - 0.1,
        );
        tl.fromTo(
          "#arrow",
          { opacity: 0, x: -40, y: -40 },
          { opacity: 1, x: 0, y: 0, duration: 0.3 },
          M.kommentare + 0.05,
        );
        tl.to(
          "#arrow",
          { x: 18, y: 18, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 },
          M.kommentare + 0.4,
        );
        const tF = M.folg - 0.1;
        tl.to(
          ["#face-4", "#t-4", "#c-4", "#arrow", "#disc", "#bars"],
          { opacity: 0, duration: 0.2 },
          tF - 0.2,
        );
        tl.set(["#t-4", "#c-4", "#arrow"], { visibility: "hidden" }, tF + 0.05);
        tl.fromTo(
          "#pic",
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" },
          tF,
        );
        tl.fromTo("#plus", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tF + 0.15);
        tl.fromTo("#follow", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3 }, tF + 0.2);
        tl.fromTo(
          "#hand",
          { x: 160, y: 200, opacity: 0 },
          { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          tF + 0.35,
        );
        tl.to(
          "#hand",
          { scale: 0.86, transformOrigin: "40% 0%", duration: 0.1, ease: "power2.in" },
          tF + 0.95,
        );
        tl.to("#hand", { scale: 1, duration: 0.15, ease: "power2.out" }, tF + 1.05);
        tl.fromTo(
          "#plus",
          { scale: 1, backgroundColor: "#ffd24a" },
          { scale: 1.25, backgroundColor: "#2a9d8f", duration: 0.12 },
          tF + 1.0,
        );
        tl.to("#plus", { scale: 1, duration: 0.2, ease: "back.out(2)" }, tF + 1.12);
        tl.set("#plus", { textContent: "✓" }, tF + 1.05);

        // captions: up to 3 words, current word in yellow
        const caps = document.getElementById("caps");
        const groups = [];
        let cur = [];
        WORDS.forEach((w, k) => {
          cur.push(w);
          const next = WORDS[k + 1];
          if (!next || cur.length >= 3 || /[.?!,:]$/.test(w[0]) || next[1] - w[2] > 0.2) {
            groups.push(cur);
            cur = [];
          }
        });
        groups.forEach((g, i) => {
          const el = document.createElement("div");
          el.className = "cap";
          el.innerHTML = `<span class="cap-inner">${g.map((w) => `<span class="w">${w[0]}</span>`).join(" ")}</span>`;
          caps.appendChild(el);
          const s = Math.max(0.05, g[0][1] - 0.08);
          const next = groups[i + 1] ? groups[i + 1][0][1] - 0.08 : DUR;
          const e = Math.min(next, g[g.length - 1][2] + 0.35);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.1 }, s);
          tl.to(el, { opacity: 0, duration: 0.08 }, e - 0.08);
          el.querySelectorAll(".w").forEach((sp, j) => {
            tl.fromTo(sp, { color: "#ffffff" }, { color: "#ffd24a", duration: 0.05 }, g[j][1]);
            tl.to(sp, { color: "#ffffff", duration: 0.1 }, g[j][1] + 0.3);
          });
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
