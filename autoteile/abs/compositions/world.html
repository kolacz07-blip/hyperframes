  <script>
    (function () {
      /*TIMING*/ const LINES = {"l1":{"start":0.3,"end":4.005},"l2":{"start":4.288,"end":8.427},"l3":{"start":8.81,"end":13.566},"l4":{"start":14.01,"end":16.726},"l5":{"start":17.059,"end":19.431},"l6":{"start":19.876,"end":23.197}}; const M = {"lampe":0.3,"blockieren":1.936,"abs":4.288,"sensor":6.105,"stehen":7.67,"hydraulik":9.356,"druck":10.214,"viele":10.668,"so":12.425,"lenkbar":12.98,"verdreckt":15.04,"kabel":15.949,"weiter":17.665,"werkstatt":18.806,"naechstes":20.552,"ziel":22.319}; /*END TIMING*/
      const DUR = 26.4;
      const T = THREE;
      // ---------- helpers (deterministic)
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (a, b, t) => clamp01((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const E = {
        lin: (x) => x,
        io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
        io2: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
        in3: (x) => x * x * x,
        out3: (x) => 1 - Math.pow(1 - x, 3),
        out2: (x) => 1 - (1 - x) * (1 - x),
      };
      function h2(x, y) {
        let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        n ^= n >>> 16;
        return (n >>> 0) / 4294967296;
      }
      function vnoise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const flat = (color, extra) => new T.MeshLambertMaterial(Object.assign({ color, flatShading: true }, extra || {}));

      const CUTS = [tPart1, tLenk, tPart2, tRoadIn];
      const tCarStop = tRoadIn + 2.6;
      const tOutroSpin = M.naechstes - 0.25; // the strip appears only at the end
      const tOutroStop = M.ziel + 0.05;
      const tFollow = Math.max(tOutroStop + 0.9, LINES.l6.end + 0.25);

      // ---------- renderer (portrait)
      const canvas = document.getElementById("world-canvas");
      const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      const camera = new T.PerspectiveCamera(50, 1080 / 1920, 0.03, 1400);

      // =========================================================
      const road = new T.Scene();
      const FOG = "#f6b47a";
      road.fog = new T.Fog(FOG, 45, 420);
      road.add(new T.HemisphereLight("#ffe0b8", "#5a4636", 0.95));
      const sunLight = new T.DirectionalLight("#ffc890", 1.25);
      sunLight.position.set(60, 40, 120);
      road.add(sunLight);

      // sky dome, faceted
      {
        const g = new T.SphereGeometry(700, 18, 12).toNonIndexed();
        const pos = g.attributes.position;
        const colors = [];
        const top = col("#d9685a"), mid = col("#f08f5e"), hor = col(FOG);
        for (let i = 0; i < pos.count; i += 3) {
          const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 / 700;
          const c = y < 0.08 ? hor.clone() : y < 0.4 ? hor.clone().lerp(mid, (y - 0.08) / 0.32) : mid.clone().lerp(top, Math.min(1, (y - 0.4) / 0.5));
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        g.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        road.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false })));
        const sun = new T.Mesh(new T.CircleGeometry(34, 10), new T.MeshBasicMaterial({ color: "#ffe2a0", fog: false }));
        sun.position.set(150, 70, 560);
        sun.lookAt(0, 0, 0);
        road.add(sun);
      }

      function groundH(x, z) {
        const d = Math.abs(x);
        if (d < 6) return -0.02;
        const k = Math.min(1, (d - 6) / 14);
        return (d - 6) * 0.09 + k * (vnoise(x * 0.045, z * 0.045) * 9 + vnoise(x * 0.16, z * 0.16) * 1.6) - 0.02;
      }
      // terrain
      {
        const g = new T.PlaneGeometry(280, 560, 70, 140);
        g.rotateX(-Math.PI / 2);
        g.translate(0, 0, -80);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
        const ng = g.toNonIndexed();
        ng.computeVertexNormals();
        const q = ng.attributes.position;
        const greens = ["#6f9a52", "#5f8a49", "#82a85c", "#73a058"].map(col);
        const high = col("#b39a58"), peak = col("#c98552");
        const colors = [];
        for (let i = 0; i < q.count; i += 3) {
          const cx = (q.getX(i) + q.getX(i + 1) + q.getX(i + 2)) / 3;
          const cz = (q.getZ(i) + q.getZ(i + 1) + q.getZ(i + 2)) / 3;

      // asphalt + markings

      // car
      const car = new T.Group();

      const carBodyMat = flat("#2a9d8f");
      {

        // cabin: a side profile extruded across the car (shape x = -car z)
        function profileGeo(pts, width) {

        car.add(sideGlass);
        const pillar = new T.Mesh(new T.BoxGeometry(1.68, 0.56, 0.12), carBodyMat);
        pillar.position.set(0, 1.28, 0.42);
        car.add(pillar);
        const ws = new T.Mesh(new T.BoxGeometry(1.42, 0.86, 0.04), glass);
        ws.rotation.x = 0.84;

        const lightMat = flat("#fff4d0");
        const tailMat = flat("#c0392b");
        for (const s of [-1, 1]) {

      }
      const hazardMat = flat("#ff9b2f");
      const hazards = [];
      for (const [x, z] of [[-0.96, -1.9], [0.96, -1.9], [-0.96, 1.9], [0.96, 1.9]]) {
        const h = new T.Mesh(new T.BoxGeometry(0.08, 0.12, 0.3), hazardMat);
        h.position.set(x, 0.86, z);

        car.add(h);

      }
      const wheels = [];
      function makeWheel() {
        const w = new T.Group();
        const tire = new T.Mesh(new T.CylinderGeometry(0.37, 0.37, 0.27, 12), flat("#2a2a2e"));
        tire.rotation.z = Math.PI / 2;

        const rim = new T.Mesh(new T.CylinderGeometry(0.25, 0.25, 0.28, 10), flat("#cfd3da"));

          const sp = new T.Mesh(new T.BoxGeometry(0.02, 0.36, 0.07), flat("#8d939d"));

      }
      const FL = [-0.86, 0.37, -1.35];
      for (const [x, z] of [[-0.86, -1.35], [0.86, -1.35], [-0.86, 1.4], [0.86, 1.4]]) {

      }
      // hum rings around the front wheel (road)
      const ringMat = (o) => new T.MeshBasicMaterial({ color: "#ffd24a", transparent: true, opacity: o, fog: false, depthWrite: false });
      const roadRings = [];
      for (let k = 0; k < 3; k++) {
        const m = new T.Mesh(new T.TorusGeometry(1, 0.025, 3, 36), ringMat(0));
        m.rotation.y = Math.PI / 2;
        m.position.set(FL[0] - 0.2, FL[1], FL[2]);
        car.add(m);
        roadRings.push(m);
      }

      const V = 13; // m/s
      function carState(t) {
        if (t < tRoadIn) return { x: 1.8, z: -V * t, dist: V * t };
        const dt = t - tRoadIn;
        const Tst = tCarStop - tRoadIn;
        const z0 = -118;
        const k = Math.min(dt, Tst);
        const d = V * k - (V / (2 * Tst)) * k * k;
        const shift = E.io2(ramp(tRoadIn + 0.6, tCarStop, t));
        return { x: 1.8 + shift * 1.5, z: z0 - d, dist: 2000 + d, yaw: Math.sin(Math.PI * shift) * 0.06 };
      }


      // =========================================================
      // ABS WORLD (wheel hub from the side: disc, tone ring, sensor, caliper, hydraulic unit)
      // =========================================================
      const brk = new T.Scene();
      {
        const g = new T.IcosahedronGeometry(70, 2);
        const pos = g.attributes.position;
        const colors = [];
        const top = col("#ea9662"), mid = col("#cc6b50"), bot = col("#7a3a48");
        for (let i = 0; i < pos.count; i += 3) {
          const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 / 70;
          const j = (h2(i, 3) - 0.5) * 0.06;
          const c = y > 0 ? mid.clone().lerp(top, Math.min(1, y * 1.4 + j)) : mid.clone().lerp(bot, Math.min(1, -y * 1.3 + j));
          for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        g.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
        brk.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
      }
      brk.add(new T.HemisphereLight("#ffe6cc", "#6b3a3a", 0.85));
      const bKey = new T.DirectionalLight("#fff1dd", 1.15);
      bKey.position.set(9, 10, 6);
      brk.add(bKey);
      const bRim = new T.DirectionalLight("#b9d3ff", 0.6);
      bRim.position.set(-9, 3, -8);
      brk.add(bRim);

      const addTo = (p, geo, mat, pos, rot) => {
        const m = new T.Mesh(geo, mat);
        if (pos) m.position.set(pos[0], pos[1], pos[2]);
        if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
        p.add(m);
        return m;
      };
      const RX = [0, 0, Math.PI / 2]; // cylinder axis along x
      const matSteel = flat("#b9bec8");
      const matDark = flat("#2c2a30");

      // tyre (sidewall ring) for context
      {
        const pts = [[2.45, -0.8], [3.3, -0.8], [3.45, -0.5], [3.45, 0.5], [3.3, 0.8], [2.45, 0.8]].map((p) => new T.Vector2(p[0], p[1]));
        const g = new T.LatheGeometry(pts, 28);
        g.rotateZ(Math.PI / 2);
        addTo(brk, g, flat("#2a2a2e", { side: T.DoubleSide }), [0.25, 0, 0]);
      }
      // rotating parts: disc, hub, bolts, tone ring
      const wheel = new T.Group();
      brk.add(wheel);
      addTo(wheel, new T.CylinderGeometry(2.2, 2.2, 0.26, 28), flat("#b7bcc6"), [0, 0, 0], RX);
      addTo(wheel, new T.CylinderGeometry(0.85, 0.85, 0.7, 12), flat("#9aa0aa"), [0.35, 0, 0], RX);
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2;
        addTo(wheel, new T.CylinderGeometry(0.11, 0.11, 0.4, 6), flat("#e3e6eb"), [0.8, Math.cos(a) * 0.5, Math.sin(a) * 0.5], RX);
      }
      for (let k = 0; k < 8; k++) addTo(wheel, new T.BoxGeometry(0.28, 0.1, 1.6), flat("#8d939d"), [0.06, 0, 0], [(k / 8) * Math.PI, 0, 0]).position.x = 0.14;
      const TR_X = -0.55;
      addTo(wheel, new T.TorusGeometry(1.25, 0.12, 4, 32), flat("#6f747e"), [TR_X, 0, 0], [0, Math.PI / 2, 0]);
      for (let k = 0; k < 40; k++) {
        const a = (k / 40) * Math.PI * 2;
        addTo(wheel, new T.BoxGeometry(0.22, 0.2, 0.1), flat("#8d939d"), [TR_X, Math.cos(a) * 1.42, Math.sin(a) * 1.42], [a, 0, 0]);
      }
      // caliper (static) at the rear-top of the disc, with two pads
      const caliper = new T.Group();
      caliper.position.set(0, 1.62, -1.55);
      caliper.rotation.x = -Math.PI / 4;
      brk.add(caliper);
      addTo(caliper, new T.BoxGeometry(1.0, 0.8, 1.2), flat("#d9483b"), [0, 0.35, 0]);
      const pads = [-1, 1].map((sd) => addTo(caliper, new T.BoxGeometry(0.14, 0.7, 1.0), flat("#4a3b33"), [sd * 0.24, -0.1, 0]));
      // the wheel-speed sensor above the tone ring
      const SENSOR = new T.Vector3(TR_X, 2.05, 0.2);
      const sensor = new T.Group();
      sensor.position.copy(SENSOR);
      brk.add(sensor);
      addTo(sensor, new T.CylinderGeometry(0.17, 0.17, 0.8, 8), matDark);
      addTo(sensor, new T.BoxGeometry(0.5, 0.12, 0.5), flat("#5f6370"), [0, 0.25, 0]);
      const sensorTip = addTo(sensor, new T.CylinderGeometry(0.12, 0.12, 0.12, 8), flat("#ffd24a"), [0, -0.44, 0]);
      // hydraulic unit with control box, valves and pump motor
      const HCU = new T.Vector3(-1.5, 4.5, -2.8);
      const hcu = new T.Group();
      hcu.position.copy(HCU);
      brk.add(hcu);
      addTo(hcu, new T.BoxGeometry(1.7, 1.2, 1.3), flat("#c3c8d1"));
      addTo(hcu, new T.BoxGeometry(1.7, 1.2, 0.45), matDark, [0, 0, 0.88]);
      const valves = [];
      for (let k = 0; k < 4; k++) valves.push(addTo(hcu, new T.CylinderGeometry(0.16, 0.16, 0.35, 8), flat("#8d939d"), [-0.6 + k * 0.4, 0.75, -0.2]));
      addTo(hcu, new T.CylinderGeometry(0.42, 0.42, 0.9, 10), flat("#5f6370"), [-1.25, -0.1, -0.1], RX);
      // sensor cable in two pieces (it breaks in l4), and the steel brake line to the caliper
      const cableA = new T.CatmullRomCurve3([SENSOR.clone().add(new T.Vector3(0, 0.3, 0)), new T.Vector3(TR_X - 0.1, 3.0, 0.1), new T.Vector3(-0.8, 3.6, -0.6)]);
      const cableB = new T.CatmullRomCurve3([new T.Vector3(-0.8, 3.6, -0.6), new T.Vector3(-1.0, 4.1, -1.3), HCU.clone().add(new T.Vector3(0.2, -0.3, 1.1))]);
      addTo(brk, new T.TubeGeometry(cableA, 24, 0.08, 6), matDark);
      const cableBMesh = new T.Group();
      brk.add(cableBMesh);
      addTo(cableBMesh, new T.TubeGeometry(cableB, 24, 0.08, 6), matDark);
      const line = new T.CatmullRomCurve3([HCU.clone().add(new T.Vector3(0.7, -0.6, -0.2)), new T.Vector3(-0.2, 3.2, -2.6), new T.Vector3(0.0, 2.6, -2.2), new T.Vector3(0, 2.3, -1.85)]);
      addTo(brk, new T.TubeGeometry(line, 30, 0.07, 6), flat("#d0d4dc"));
      const pelletGeo = new T.BoxGeometry(0.11, 0.11, 0.11);
      const pelletMat = new T.MeshBasicMaterial({ color: "#ffd24a" });
      const sigPellets = Array.from({ length: 8 }, () => addTo(brk, pelletGeo, pelletMat));
      const pressPellets = Array.from({ length: 8 }, () => addTo(brk, pelletGeo, new T.MeshBasicMaterial({ color: "#ff7b6b" })));
      // dirt on the sensor tip and tone ring (l4)
      const r7 = rng(77);
      const dirt = Array.from({ length: 26 }, (_, i) => {
        const near = i < 10;
        const p = near
          ? [SENSOR.x + (r7() - 0.5) * 0.35, SENSOR.y - 0.45 + (r7() - 0.5) * 0.2, SENSOR.z + (r7() - 0.5) * 0.35]
          : [TR_X, 0, 0];
        const m = addTo(near ? brk : wheel, new T.TetrahedronGeometry(0.07 + r7() * 0.08, 0), flat(i % 2 ? "#6b4a35" : "#4a3b33"), p, [r7() * 3, r7() * 3, 0]);
        if (!near) {
          const a = r7() * Math.PI * 2;
          m.position.set(TR_X + (r7() - 0.5) * 0.2, Math.cos(a) * 1.45, Math.sin(a) * 1.45);
        }
        return m;
      });
      const sparkMats = ["#ffd24a", "#fff6c4"].map((c) => new T.MeshBasicMaterial({ color: c }));
      const gapSparks = Array.from({ length: 10 }, (_, i) => ({ m: addTo(brk, new T.BoxGeometry(0.05, 0.05, 0.18), sparkMats[i % 2]), a: r7() * Math.PI * 2, d: r7() }));

      // wheel speed (rev/s) in the part shots
      function wheelSpeed(t) {
        if (t < M.stehen - 0.7) return 1.3;
        if (t < M.stehen + 0.1) return 1.3 * (1 - E.io2(ramp(M.stehen - 0.7, M.stehen + 0.1, t)));
        if (t < M.druck - 0.1) return 0;
        if (t < LINES.l4.start) return 0.55 + 0.45 * Math.sin((t - M.druck) * Math.PI * 2 * 4);
        return 0.35;
      }
      const HZ = 120;
      const wTable = new Float32Array(Math.ceil((DUR + 1) * HZ) + 2);
      for (let i = 1; i < wTable.length; i++) wTable[i] = wTable[i - 1] + wheelSpeed(i / HZ) / HZ;
      const wheelAt = (t) => {
        const f = Math.max(0, Math.min(wTable.length - 2, t * HZ));
        const i = Math.floor(f);
        return lerp(wTable[i], wTable[i + 1], f - i);
      };
      // ABS cycling: valves release pressure many times a second
      const absCycle = (t) => (t > M.druck - 0.1 && t < tLenk ? 0.5 + 0.5 * Math.sin((t - M.druck) * Math.PI * 2 * 4) : t > M.hydraulik - 0.1 && t < M.druck ? 1 : 0.7);

      // ---- road extras: skid marks and tyre smoke for the locked-wheel stop
      wheels.forEach((w) => (w.rotation.order = "YXZ"));
      const skidMat = new T.MeshBasicMaterial({ color: "#26232a", transparent: true, opacity: 0.85, depthWrite: false });
      const skids = wheels.map(() => {
        const m = new T.Mesh(new T.BoxGeometry(0.24, 0.01, 1), skidMat);
        road.add(m);
        return m;
      });
      const puffMats = Array.from({ length: 18 }, () => new T.MeshBasicMaterial({ color: "#e9e4dc", transparent: true, opacity: 0, depthWrite: false }));
      const puffs = puffMats.map((m, i) => ({ m: new T.Mesh(new T.IcosahedronGeometry(0.45, 0), m), d: h2(i, 21), w: i % 2 ? 3 : 2 }));
      puffs.forEach((p) => road.add(p.m));

      // segment A: full stop without ABS (wheels locked, car slides and turns away)
      const A0 = 0.25, A_V = 17, A_DEC = 5.6;
      const aStop = A0 + A_V / A_DEC;
      function stateA(t) {
        const tb = Math.min(t, aStop);
        const d = tb < A0 ? A_V * tb : A_V * A0 + A_V * (tb - A0) - 0.5 * A_DEC * (tb - A0) * (tb - A0);
        const slide = E.io2(ramp(A0 + 0.3, aStop, t));
        return { x: 1.8 + slide * 0.9, z: 60 - d, yaw: -0.5 * slide, roll: Math.min(t, A0) * A_V, steer: 0.45 * ramp(A0 + 0.2, A0 + 0.7, t), locked: t > A0 && t < aStop + 0.05 };
      }
      // segment B: full stop with ABS (wheels keep turning, the car swerves around and stays steerable)
      const B_V = 15, B_DEC = 6.5;
      function stateB(t) {
        const u = Math.max(0, t - tLenk);
        const ub = Math.min(u, B_V / B_DEC);
        const d = B_V * ub - 0.5 * B_DEC * ub * ub;
        const k = clamp01(u / 1.9);
        return { x: 1.8 - 1.6 * E.io2(k), z: -40 - d, yaw: 0.22 * Math.sin(Math.PI * k), roll: d + 0.12 * Math.sin(u * 50), steer: 0.4 * Math.cos(Math.PI * k) * ramp(0, 0.2, u), locked: false };
      }

      // =========================================================
      // CAMERA PATHS
      // =========================================================
      const brkKeys = [
        { t: tPart1, p: [-10.5, 1.8, 3.6], l: [-0.6, 1.0, -0.6] },
        { t: M.sensor - 0.2, p: [-10.0, 1.8, 3.4], l: [-0.6, 1.0, -0.6], e: "lin" },
        { t: M.sensor + 0.4, p: [-5.2, 2.7, 2.2], l: [-0.6, 1.8, 0], e: "io" },
        { t: M.stehen + 0.2, p: [-7.6, 1.4, 2.8], l: [-0.6, 0.7, -0.3], e: "io" },
        { t: M.hydraulik + 0.35, p: [-8.0, 3.8, 2.2], l: [-0.9, 3.1, -1.6], e: "io" },
        { t: M.druck + 0.35, p: [-7.4, 2.6, 0.8], l: [-0.6, 2.1, -1.5], e: "io" },
        { t: tLenk, p: [-7.2, 2.6, 0.6], l: [-0.6, 2.1, -1.5], e: "lin" },
        { t: tPart2, p: [-6.4, 1.4, 3.0], l: [-0.6, 0.2, 0], e: "lin" },
        { t: M.kabel - 0.15, p: [-6.2, 1.4, 2.9], l: [-0.6, 0.2, 0], e: "lin" },
        { t: M.kabel + 0.25, p: [-5.8, 3.6, 2.0], l: [-0.8, 3.2, -0.7], e: "io" },
        { t: tRoadIn, p: [-5.6, 3.5, 1.9], l: [-0.8, 3.2, -0.7], e: "lin" },
      ];
      const roadKeys = [
        { t: tRoadIn, p: [-3.2, 1.0, -7.5], l: [0, 0.7, -0.5] },
        { t: tCarStop, p: [-6.5, 2.4, -10.5], l: [0, 0.9, -0.3], e: "out3" },
        { t: DUR, p: [-7.2, 2.8, -11.4], l: [0, 1.0, -0.3], e: "lin" },
      ];
      function sample(keys, t) {
        if (t <= keys[0].t) return keys[0];
        for (let i = 1; i < keys.length; i++) {
          const b = keys[i];
          if (t <= b.t) {
            const a = keys[i - 1];
            const k = E[b.e || "io"](clamp01((t - a.t) / Math.max(1e-3, b.t - a.t)));
            return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l.map((v, j) => lerp(v, b.l[j], k)) };
          }
        }
        return keys[keys.length - 1];
      }

      // =========================================================
      // LABELS + STRIP (HTML)
      // =========================================================
      const v3 = new T.Vector3();
      const labelWin = {};
      let nowT = 0;
      function place(id, world) {
        const el = document.getElementById(id);
        const w = labelWin[id];
        const on = w && nowT >= w[0] - 0.02 && nowT <= w[1] + 0.02;
        el.style.visibility = on ? "visible" : "hidden";
        if (!on) return;
        v3.copy(world).project(camera);
        const x = Math.max(200, Math.min(880, (v3.x * 0.5 + 0.5) * 1080));
        const y = (-v3.y * 0.5 + 0.5) * 1920;
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      }

      const SLOT = 200; // px between icon centres
      const N = 10;
      const slots = Array.from({ length: N }, (_, i) => document.getElementById("slot-" + i));
      const shards = Array.from(document.querySelectorAll("#strip-wrap .shard"));
      const shardDir = shards.map((_, i) => {
        const a = (i / shards.length) * Math.PI * 2 + 0.3;
        return [Math.cos(a), Math.sin(a) * 0.8 - 0.35, 0.7 + h2(i, 9) * 0.6];
      });
      // slot-machine ease: very fast at p=0, slight overshoot, settle
      const reel = (p) => {
        const c1 = 0.9, c3 = c1 + 1;
        const q = p - 1;
        return 1 + c3 * q * q * q + c1 * q * q;
      };
      function stripOffset(t, target, t0, t1, loops) {
        const p = clamp01((t - t0) / (t1 - t0));
        return target * SLOT - (1 - reel(p)) * loops * N * SLOT;
      }
      function drawStrip(off, burstT) {
        const W = N * SLOT;
        slots.forEach((el, i) => {
          let x = i * SLOT - off;
          x = ((((x + W / 2) % W) + W) % W) - W / 2;
          el.style.transform = `translateX(${(540 + x).toFixed(1)}px)`;
        });
        shards.forEach((el, i) => {
          const k = clamp01(burstT / 0.7);
          const on = burstT > 0 && k < 1;
          el.style.opacity = on ? (1 - k).toFixed(3) : "0";
          if (!on) return;
          const d = shardDir[i];
          const dist = E.out3(k) * 330 * d[2];
          el.style.transform = `translate(${(d[0] * dist).toFixed(1)}px, ${(d[1] * dist + k * k * 140).toFixed(1)}px) rotate(${(k * 540 + i * 40).toFixed(0)}deg)`;
        });
      }

      // =========================================================
      // RENDER
      // =========================================================
      const iris = document.getElementById("world-iris");
      const kicker = document.getElementById("strip-kicker");
      const word = document.getElementById("strip-word");

      function render(t) {
        nowT = t;
        // iris at every cut between road and part
        let ir = 0;
        for (const c of CUTS) ir = Math.max(ir, ramp(c - 0.22, c, t) * (1 - ramp(c, c + 0.35, t)));
        iris.style.opacity = ir.toFixed(3);

        // closing strip: lands on the "?" slot
        drawStrip(stripOffset(t, 9, tOutroSpin, tOutroStop, 2), t - tOutroStop);
        word.textContent = t >= tOutroStop - 0.02 ? "Du entscheidest!" : "…";

        const seg = t < tPart1 ? "A" : t < tLenk ? "P" : t < tPart2 ? "B" : t < tRoadIn ? "P" : "C";
        if (seg === "P") {
          wheel.rotation.x = -wheelAt(t) * Math.PI * 2;
          const cyc = absCycle(t);
          pads.forEach((p, i) => (p.position.x = (i ? 1 : -1) * (0.24 - 0.08 * cyc)));
          valves.forEach((v, i) => (v.position.y = 0.75 + (t > M.druck - 0.1 && t < tLenk ? 0.08 * Math.sin((t - M.druck) * Math.PI * 8 + i) : 0)));
          // the sensor signal runs to the control unit (stops once the cable is broken)
          const broken = t > M.kabel - 0.05;
          const sig = t > M.sensor - 0.1 && !broken && t < tRoadIn;
          sigPellets.forEach((m, i) => {
            m.visible = sig;
            if (!sig) return;
            const u = (((i / sigPellets.length + t * 0.7) % 1) + 1) % 1;
            m.position.copy(u < 0.5 ? cableA.getPointAt(u * 2) : cableB.getPointAt((u - 0.5) * 2));
            if (u >= 0.5 && broken) m.visible = false;
          });
          const press = t > M.hydraulik - 0.1 && t < tLenk;
          pressPellets.forEach((m, i) => {
            m.visible = press;
            if (!press) return;
            const dir = t > M.druck ? Math.sin((t - M.druck) * Math.PI * 8) : 1; // back and forth while cycling
            const u = (((i / pressPellets.length + (t > M.druck ? 0.08 * dir : t * 0.6)) % 1) + 1) % 1;
            m.position.copy(line.getPointAt(u));
          });
          sensorTip.material.color.set(t > M.stehen - 0.1 && t < M.hydraulik ? "#ff5a4a" : "#ffd24a");
          const dirtK = ramp(M.verdreckt - 0.2, M.verdreckt + 0.3, t) * (t > tPart2 ? 1 : 0);
          dirt.forEach((m, i) => (m.visible = dirtK > (i % 13) / 14));
          cableBMesh.position.set(broken ? 0.18 : 0, broken ? 0.22 : 0, 0);
          gapSparks.forEach((sp) => {
            const k = (((t * 3 + sp.d) % 1) + 1) % 1;
            sp.m.visible = broken && k < 0.4 && t < tRoadIn;
            if (!sp.m.visible) return;
            const r = (k / 0.4) * 0.6;
            sp.m.position.set(-0.8 + Math.cos(sp.a) * r + 0.09, 3.6 + Math.sin(sp.a) * r + 0.11 - k * 0.4, -0.6);
            sp.m.rotation.y = sp.a;
          });
          const cam = sample(brkKeys, t);
          camera.position.set(cam.p[0], cam.p[1], cam.p[2]);
          camera.lookAt(cam.l[0], cam.l[1], cam.l[2]);
          camera.updateMatrixWorld();
          brk.updateMatrixWorld(true);
          renderer.render(brk, camera);

          place("lbl-sensor", new T.Vector3(SENSOR.x, SENSOR.y + 0.35, SENSOR.z));
          place("lbl-steht", new T.Vector3(TR_X, 1.0, 1.05));
          place("lbl-hydraulik", new T.Vector3(HCU.x + 0.6, HCU.y - 0.6, HCU.z + 0.7));
          place("lbl-druck", new T.Vector3(0.2, 1.7, -1.5));
          place("lbl-dreck", new T.Vector3(SENSOR.x, SENSOR.y - 0.5, SENSOR.z + 0.3));
          place("lbl-kabel", new T.Vector3(-0.7, 3.75, -0.55));
          return;
        }

        // ---- road
        document.querySelectorAll("#root .lbl").forEach((el) => (el.style.visibility = "hidden"));
        roadRings.forEach((m) => (m.visible = false));
        let s, camP, camL, worldCam = true;
        if (seg === "A") {
          s = stateA(t);
          const k = ramp(0, tPart1, t);
          camP = [lerp(-5.0, -7.0, k), lerp(1.8, 3.4, k), lerp(-9.0, -5.5, k)];
          camL = [0, 0.5, 0];
        } else if (seg === "B") {
          s = stateB(t);
          const k = ramp(tLenk, tPart2, t);
          camP = [lerp(-4.5, -6.5, k), lerp(5.0, 6.0, k), lerp(-9.0, -7.0, k)];
          camL = [0, 0.4, -1.5];
        } else {
          worldCam = false;
          s = carState(t);
          s.roll = s.dist;
          s.steer = 0;
          s.locked = false;
        }
        car.position.set(s.x, 0, s.z);
        car.rotation.set(0, s.yaw || 0, 0);
        const roll = -s.roll / 0.37;
        wheels.forEach((w, i) => {
          const front = i < 2;
          w.rotation.y = (w.position.x > 0 ? Math.PI : 0) + (front ? s.steer : 0);
          w.rotation.x = w.position.x > 0 ? -roll : roll;
        });
        const braking = seg === "C" ? ramp(tRoadIn, tRoadIn + 0.3, t) * (1 - ramp(tCarStop - 0.2, tCarStop + 0.4, t)) : seg === "A" ? ramp(A0, A0 + 0.2, t) * (1 - ramp(aStop - 0.1, aStop + 0.3, t)) : 1 - ramp(tLenk + 2.0, tLenk + 2.5, t);
        car.rotation.x = -0.04 * braking;
        const stopped = seg === "C" && t > tCarStop - 0.3;
        hazards.forEach((h) => (h.visible = stopped && Math.floor((t - tCarStop) * 1.6) % 2 === 0));
        car.updateMatrixWorld(true);
        // skid marks (A only): from where the wheels locked to where they are now
        if (seg === "A" && t > A0) {
          const s0 = stateA(A0);
          const m0 = new T.Matrix4().makeRotationY(s0.yaw).setPosition(s0.x, 0, s0.z);
          wheels.forEach((w, i) => {
            const a = w.position.clone().setY(0).applyMatrix4(m0);
            const b = car.localToWorld(w.position.clone().setY(0));
            const len = Math.max(0.01, a.distanceTo(b));
            skids[i].visible = true;
            skids[i].position.set((a.x + b.x) / 2, 0.025, (a.z + b.z) / 2);
            skids[i].scale.z = len;
            skids[i].rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
          });
        } else skids.forEach((m) => (m.visible = false));
        // tyre smoke while the locked wheels slide
        puffs.forEach((p) => {
          const age = (((t * 1.3 + p.d) % 1) + 1) % 1;
          const born = t - age * 0.9;
          const on = seg === "A" && born > A0 && born < aStop;
          p.m.visible = on;
          if (!on) return;
          const sb = stateA(born);
          const mb = new T.Matrix4().makeRotationY(sb.yaw).setPosition(sb.x, 0, sb.z);
          const wp = wheels[p.w].position.clone().setY(0.2).applyMatrix4(mb);
          p.m.position.set(wp.x + age * 0.6, wp.y + age * 1.4, wp.z);
          p.m.scale.setScalar(0.5 + age * 2.2);
          p.m.material.opacity = 0.7 * (1 - age);
        });
        if (worldCam) {
          camera.position.set(s.x + camP[0], camP[1], s.z + camP[2]);
          camera.lookAt(s.x + camL[0], camL[1], s.z + camL[2]);
        } else {
          const c = sample(roadKeys, t);
          camera.position.copy(car.localToWorld(new T.Vector3(c.p[0], c.p[1], c.p[2])));
          camera.lookAt(car.localToWorld(new T.Vector3(c.l[0], c.l[1], c.l[2])));
        }
        camera.updateMatrixWorld();
        renderer.render(road, camera);
      }

      // =========================================================
      // TIMELINE
      // =========================================================
      const tl = gsap.timeline({ paused: true });
      const state = { t: 0 };
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);

      function showLabel(id, a, b) {
        labelWin[id] = [a, b];
        tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, a);
        tl.fromTo("#" + id + " .txt", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, a);
        tl.to("#" + id, { opacity: 0, duration: 0.15, ease: "power2.in" }, b - 0.15);
      }
      showLabel("lbl-sensor", M.sensor, M.stehen - 0.05);
      showLabel("lbl-steht", M.stehen, M.hydraulik - 0.05);
      showLabel("lbl-hydraulik", M.hydraulik, M.druck - 0.05);
      showLabel("lbl-druck", M.druck, tLenk - 0.05);
      showLabel("lbl-dreck", M.verdreckt, M.kabel - 0.05);
      showLabel("lbl-kabel", M.kabel, tRoadIn - 0.05);

      // ABS warning lamp: on from frame 0 in the hook, and again on the final stop
      tl.fromTo("#abslamp", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.to("#abslamp", { opacity: 0, duration: 0.15 }, tPart1 - 0.2);
      tl.to("#abslamp", { opacity: 1, duration: 0.2 }, tRoadIn + 0.3);
      tl.to("#abslamp", { opacity: 0, duration: 0.2 }, tOutroSpin - 0.2);
      tl.set("#abslamp", { visibility: "hidden" }, tOutroSpin);
      // road tags
      tl.fromTo("#tag-ohne", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, M.blockieren);
      tl.to("#tag-ohne", { opacity: 0, duration: 0.15 }, tPart1 - 0.2);
      tl.set("#tag-ohne", { visibility: "hidden" }, tPart1);
      tl.fromTo("#tag-mit", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, M.lenkbar - 0.1);
      tl.to("#tag-mit", { opacity: 0, duration: 0.15 }, tPart2 - 0.2);
      tl.set("#tag-mit", { visibility: "hidden" }, tPart2);

      // follow hint early in the film, so more than the 2-3 % who reach the end see it
      const tHint = M.sensor + 0.3;
      tl.fromTo("#follow-hint", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, tHint);
      tl.to("#fh-plus", { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, tHint + 0.5);
      tl.to("#follow-hint", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, tHint + 3.0);
      tl.set("#follow-hint", { visibility: "hidden" }, tHint + 3.3);

      // hook plate: on screen from frame 0
      tl.fromTo("#plate-hook", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#plate-hook .plate", { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.to("#plate-hook", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, tPart1 - 0.2);

      // closing strip over a dimmed road
      tl.fromTo("#strip-dim", { opacity: 0 }, { opacity: 0.55, duration: 0.3 }, tOutroSpin - 0.15);
      tl.fromTo("#strip-wrap", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, tOutroSpin - 0.15);
      tl.fromTo("#strip-word", { scale: 0.7 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, tOutroStop);
      tl.to("#strip-ring", { scale: 1.18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, tOutroStop);

      // Werkstatt plate
      tl.fromTo("#plate-werkstatt", { opacity: 0 }, { opacity: 1, duration: 0.1 }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt .plate", { y: 50, clipPath: "inset(0 0 100% 0)" }, { y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power4.out" }, M.werkstatt - 0.05);
      tl.fromTo("#plate-werkstatt-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, M.werkstatt + 0.15);
      tl.to("#plate-werkstatt", { opacity: 0, duration: 0.2 }, tOutroSpin - 0.2);

      // follow card
      tl.fromTo("#follow", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tFollow);
      tl.set(["#strip-wrap", "#strip-dim"], { visibility: "hidden" }, tFollow + 0.21);
      tl.fromTo("#follow-pic", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, tFollow);
      tl.fromTo("#follow-text", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, tFollow + 0.15);
      tl.fromTo("#follow-hand", { x: 160, y: 200, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, tFollow + 0.3);
      tl.to("#follow-hand", { scale: 0.86, transformOrigin: "40% 0%", duration: 0.1, ease: "power2.in" }, tFollow + 0.85);
      tl.to("#follow-hand", { scale: 1, duration: 0.15, ease: "power2.out" }, tFollow + 0.95);
      tl.fromTo("#follow-plus", { scale: 1, backgroundColor: "#ffd24a" }, { scale: 1.25, backgroundColor: "#2a9d8f", duration: 0.12, ease: "power2.out" }, tFollow + 0.9);
      tl.to("#follow-plus", { scale: 1, duration: 0.2, ease: "back.out(2)" }, tFollow + 1.02);
      tl.set("#follow-plus", { textContent: "✓" }, tFollow + 0.95);

      render(0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
